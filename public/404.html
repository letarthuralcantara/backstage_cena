<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0c" />
  <title>Página não encontrada | Backstage Cena</title>
  <meta name="robots" content="noindex" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/content.css">
</head>
<body class="erro-404">
  <div class="page">
    <canvas id="dust" aria-hidden="true"></canvas>
    <header class="header">
      <a class="brand" href="index.html" aria-label="Voltar para o Backstage Cena"><img src="images/logo.png" alt="Backstage Cena" class="logo-img"></a>
    </header>
    <main class="main">
      <p class="code">Erro 404</p>
      <h1 class="title">Página não encontrada</h1>
      <p class="description">O endereço <code id="path-slot">/</code> não existe ou foi movido.</p>
      <div class="actions"><a class="btn-primary" href="index.html">Voltar ao início</a></div>
    </main>
    <footer class="footer"><span class="footer-note">Backstage Cena</span></footer>
  </div>
  <script>
    try {
      document.getElementById('path-slot').textContent = window.location.pathname || '/';
    } catch (error) {}

    const canvas = document.getElementById('dust');
    const context = canvas.getContext('2d');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    let particles = [];

    function resizeCanvas() {
      const ratio = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(window.innerWidth * ratio);
      canvas.height = Math.floor(window.innerHeight * ratio);
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
    }

    class Particle {
      constructor() { this.reset(true); }
      reset(initial) {
        this.x = Math.random() * window.innerWidth;
        this.y = initial ? Math.random() * window.innerHeight : window.innerHeight + 8;
        this.size = Math.random() * 1.4 + .35;
        this.speedY = -(Math.random() * .2 + .04);
        this.speedX = (Math.random() - .5) * .12;
        this.opacity = Math.random() * .3 + .04;
        this.color = Math.random() > .5 ? '139,92,246' : '217,70,239';
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.y < -8 || this.x < -8 || this.x > window.innerWidth + 8) this.reset(false);
      }
      draw() {
        context.fillStyle = `rgba(${this.color}, ${this.opacity})`;
        context.beginPath();
        context.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        context.fill();
      }
    }

    function initParticles() {
      resizeCanvas();
      particles = Array.from({ length: window.innerWidth < 600 ? 34 : 64 }, () => new Particle());
    }

    function animate() {
      context.clearRect(0, 0, window.innerWidth, window.innerHeight);
      particles.forEach((particle) => { particle.update(); particle.draw(); });
      if (!reduceMotion) window.requestAnimationFrame(animate);
    }

    window.addEventListener('resize', initParticles, { passive: true });
    initParticles();
    animate();
  </script>
</body>
</html>
