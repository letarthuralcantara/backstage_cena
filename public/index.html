<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Backstage Cena</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Work Sans', sans-serif;
      background: #0f0f13;
      color: #e2e2f0;
      min-height: 100vh;
    }

    header {
      background: rgba(0,0,0,0.85);
      border-bottom: 2px solid rgba(139,92,246,0.4);
      padding: 20px 40px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    header h1 {
      font-family: 'Space Mono', monospace;
      font-size: 1.3rem;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header i { color: #8b5cf6; font-size: 1.3rem; }

    main { max-width: 1000px; margin: 0 auto; padding: 40px 20px; }

    h2 {
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: #8888aa;
      margin-bottom: 12px;
    }

    /* ── Formulário ── */
    .form-card {
      background: #1a1a24;
      border: 1px solid #2e2e40;
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 32px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .form-grid input, .form-grid select {
      background: #0f0f13;
      border: 1px solid #2e2e40;
      border-radius: 8px;
      padding: 10px 12px;
      color: #e2e2f0;
      font-family: inherit;
      font-size: 0.9rem;
      width: 100%;
      outline: none;
      transition: border-color .2s;
    }

    .form-grid input:focus, .form-grid select:focus {
      border-color: #8b5cf6;
    }

    .form-grid input::placeholder { color: #555570; }

    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    button:hover { opacity: .85; }
    .btn-primary   { background: #7c3aed; color: #fff; }
    .btn-secondary { background: #2e2e40; color: #e2e2f0; }
    .btn-danger    { background: #dc2626; color: #fff; }
    .btn-edit      { background: #1d4ed8; color: #fff; padding: 6px 12px; font-size: 0.8rem; }
    .btn-del       { background: #dc2626; color: #fff; padding: 6px 12px; font-size: 0.8rem; }

    /* ── Feedback ── */
    #feedback {
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      display: none;
    }

    #feedback.ok  { background: #052e16; color: #4ade80; border: 1px solid #4ade80; display: block; }
    #feedback.err { background: #450a0a; color: #f87171; border: 1px solid #f87171; display: block; }

    /* ── Lista ── */
    #lista {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .card {
      background: #1a1a24;
      border: 1px solid #2e2e40;
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: border-color .2s;
    }

    .card:hover { border-color: #7c3aed; }

    .card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8b5cf6, #6d28d9);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    .card-nome { font-weight: 700; font-size: 1rem; }
    .card-artistico { color: #8888aa; font-size: 0.85rem; }

    .card-info {
      color: #8888aa;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tags { display: flex; flex-wrap: wrap; gap: 5px; margin: 4px 0; }

    .tag {
      padding: 3px 8px;
      background: rgba(139,92,246,0.15);
      border: 1px solid rgba(139,92,246,0.3);
      border-radius: 99px;
      font-size: 0.75rem;
      color: #a78bfa;
    }
    .logo-img { 
            width: 250px; 
            padding-bottom: 20px; 
            margin-top: 20px; 
        }

    .card-actions { display: flex; gap: 8px; margin-top: 8px; }

    .empty { color: #555570; text-align: center; padding: 40px; grid-column: 1/-1; }
  </style>
</head>
<body>

<header>
   <div class="logo-container">
<img src="backstage_javascript/images/logo.png" alt="Backstage Logo" class="logo-img">        </div>
</header>

<main>

  <div class="form-card">
    <h2 id="form-titulo">Cadastrar músico</h2>
    <input type="hidden" id="editId" />

    <div class="form-grid">
      <input type="text" id="nome"          placeholder="Nome completo" />
      <input type="text" id="nomeArtistico" placeholder="Nome artístico" />
      <input type="text" id="cidade"        placeholder="Cidade" />
      <input type="text" id="estado"        placeholder="Estado (ex: PB)" />
      <input type="text" id="bio"           placeholder="Bio" />
      <input type="text" id="instrumentos"  placeholder="Instrumentos (ex: Guitarra, Baixo)" />
      <input type="text" id="generos"       placeholder="Gêneros (ex: Rock, MPB)" />
      <select id="area">
        <option value="">Área</option>
        <option value="Instrumentista">Instrumentista</option>
        <option value="Vocalista">Vocalista</option>
        <option value="Produtor">Produtor</option>
        <option value="Compositor">Compositor</option>
        <option value="DJ">DJ</option>
        <option value="Beatmaker">Beatmaker</option>
      </select>
      <input type="text" id="disponibilidade" placeholder="Disponibilidade (ex: tarde, noite)" />
    </div>

    <div class="btn-row">
      <button class="btn-primary"   onclick="salvar()"><i class="fa-solid fa-floppy-disk"></i> Salvar</button>
      <button class="btn-secondary" onclick="cancelar()">Cancelar</button>
    </div>
  </div>

  <div id="feedback"></div>

  <h2>Músicos cadastrados</h2>
  <div id="lista"><p class="empty">Carregando...</p></div>

</main>

<script type="module">
  const API = 'http://localhost:3000/api/musicos';

  // ── Feedback ─────────────────────────────────────────────
  function feedback(msg, tipo = 'ok') {
    const el = document.getElementById('feedback');
    el.textContent = msg;
    el.className = tipo;
    setTimeout(() => { el.className = ''; el.textContent = ''; }, 3500);
  }

  // ── GET — carrega todos os músicos ───────────────────────
  async function carregar() {
    const lista = document.getElementById('lista');
    try {
      const res     = await fetch(API);
      const musicos = await res.json();

      if (musicos.length === 0) {
        lista.innerHTML = '<p class="empty">Nenhum músico cadastrado.</p>';
        return;
      }

      lista.innerHTML = musicos.map(m => `
        <div class="card">
          <div class="card-header">
            <div class="avatar">${m.iniciais}</div>
            <div>
              <div class="card-nome">${m.nome}</div>
              <div class="card-artistico">${m.nomeArtistico || '—'}</div>
            </div>
          </div>
          <div class="card-info"><i class="fa-solid fa-location-dot"></i> ${m.cidade}, ${m.estado}</div>
          <div class="card-info"><i class="fa-solid fa-user"></i> ${m.area}</div>
          <div class="tags">
            ${m.instrumentos.map(i => `<span class="tag">${i}</span>`).join('')}
            ${m.generos.map(g => `<span class="tag">${g}</span>`).join('')}
          </div>
          <div class="card-actions">
            <button class="btn-edit" onclick="editar(${m.id})"><i class="fa-solid fa-pen"></i> Editar</button>
            <button class="btn-del"  onclick="deletar(${m.id})"><i class="fa-solid fa-trash"></i> Deletar</button>
          </div>
        </div>
      `).join('');

    } catch {
      lista.innerHTML = '<p class="empty">Erro ao conectar com a API. Servidor está rodando?</p>';
    }
  }

  // ── POST / PUT — salva músico ────────────────────────────
  window.salvar = async function () {
    const id = document.getElementById('editId').value;

    // Converte strings separadas por vírgula em arrays
    const instrumentos   = document.getElementById('instrumentos').value.split(',').map(s => s.trim()).filter(Boolean);
    const generos        = document.getElementById('generos').value.split(',').map(s => s.trim()).filter(Boolean);
    const disponibilidade = document.getElementById('disponibilidade').value.split(',').map(s => s.trim()).filter(Boolean);

    const body = {
      nome:          document.getElementById('nome').value,
      nomeArtistico: document.getElementById('nomeArtistico').value,
      cidade:        document.getElementById('cidade').value,
      estado:        document.getElementById('estado').value,
      bio:           document.getElementById('bio').value,
      instrumentos,
      generos,
      area:          document.getElementById('area').value,
      disponibilidade,
    };

    const url    = id ? `${API}/${id}` : API;
    const metodo = id ? 'PUT' : 'POST';

    try {
      const res   = await fetch(url, {
        method:  metodo,
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify(body),
      });

      const dados = await res.json();

      if (!res.ok) {
        feedback(dados.erros?.join(' | ') || 'Erro ao salvar.', 'err');
        return;
      }

      feedback(id ? 'Músico atualizado!' : 'Músico cadastrado!');
      cancelar();
      carregar();

    } catch {
      feedback('Erro de conexão com a API.', 'err');
    }
  };

  // ── GET /:id — preenche form para edição ─────────────────
  window.editar = async function (id) {
    try {
      const res = await fetch(`${API}/${id}`);
      const m   = await res.json();

      document.getElementById('editId').value          = m.id;
      document.getElementById('nome').value            = m.nome;
      document.getElementById('nomeArtistico').value   = m.nomeArtistico;
      document.getElementById('cidade').value          = m.cidade;
      document.getElementById('estado').value          = m.estado;
      document.getElementById('bio').value             = m.bio;
      document.getElementById('instrumentos').value    = m.instrumentos.join(', ');
      document.getElementById('generos').value         = m.generos.join(', ');
      document.getElementById('area').value            = m.area;
      document.getElementById('disponibilidade').value = m.disponibilidade.join(', ');
      document.getElementById('form-titulo').textContent = 'Editar músico';

      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch {
      feedback('Erro ao buscar músico.', 'err');
    }
  };

  // ── DELETE /:id — remove músico ──────────────────────────
  window.deletar = async function (id) {
    if (!confirm(`Remover músico #${id}?`)) return;

    try {
      const res = await fetch(`${API}/${id}`, { method: 'DELETE' });

      if (!res.ok) {
        const dados = await res.json();
        feedback(dados.erro || 'Erro ao remover.', 'err');
        return;
      }

      feedback('Músico removido.');
      carregar();
    } catch {
      feedback('Erro de conexão.', 'err');
    }
  };

  // ── Limpa o formulário ───────────────────────────────────
  window.cancelar = function () {
    ['editId','nome','nomeArtistico','cidade','estado','bio','instrumentos','generos','disponibilidade'].forEach(id => {
      document.getElementById(id).value = '';
    });
    document.getElementById('area').value = '';
    document.getElementById('form-titulo').textContent = 'Cadastrar músico';
  };

  carregar();
</script>

</body>
</html>
