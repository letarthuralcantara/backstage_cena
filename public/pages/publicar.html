<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backstage | Nova Postagem</title>
    <meta name="description" content="Compartilhe uma nova faixa, vídeo ou novidade com a comunidade Backstage Cena.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="shortcut icon" href="../images/favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/global.css">
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-glow: rgba(139, 92, 246, 0.4);
            --secondary: #d946ef;
            --accent-cyan: #06b6d4;
            --bg-dark: #050505;
            --bg-card: rgba(15, 15, 15, 0.85);
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text-muted: #bbb;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: #fff;
            min-height: 100vh;
            background-image:
                radial-gradient(circle at 10% 10%, rgba(139, 92, 246, 0.1), transparent 50%),
                radial-gradient(circle at 90% 90%, rgba(217, 70, 239, 0.08), transparent 50%);
            background-attachment: fixed;
        }

        /* Container com margem superior adequada para desgrudar da navbar */
        .container { 
            max-width: 720px; 
            margin: 40px auto; 
            padding: 0 24px 80px;
            position: relative;
            z-index: 1;
        }

        .page-title { font-family:'Poppins',sans-serif; font-size: 26px; font-weight: 800; margin-bottom: 6px; color: #fff; }
        .page-subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 28px; }

        .glass-card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            padding: 24px;
            position: relative;
            z-index: 2;
        }

        /* ── ABAS ── */
        .tabs { 
            display: flex; 
            gap: 8px; 
            margin-bottom: 20px; 
            position: relative;
            z-index: 10;
        }
        .tab-btn {
            flex: 1;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: var(--text-muted);
            border-radius: 14px;
            padding: 14px;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all .25s;
            outline: none;
        }
        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }
        .tab-btn.active {
            color: white;
            border-color: var(--primary);
            background: linear-gradient(135deg, rgba(139,92,246,.3), rgba(217,70,239,.2));
            box-shadow: 0 4px 15px rgba(139, 92, 246, 0.2);
        }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; animation: fadeIn 0.3s ease; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ── FORM ── */
        .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
        .form-group label { font-size: 11px; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; }
        .form-control {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px 16px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }
        .form-control:focus { border-color: var(--primary); background: rgba(139, 92, 246, 0.1); }

        .file-input-wrapper {
            position: relative;
            min-height: 100px;
            border: 2px dashed var(--glass-border);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .file-input-wrapper:hover { border-color: var(--primary); background: rgba(139, 92, 246, 0.05); }
        .file-input-wrapper i { font-size: 24px; color: var(--text-muted); }
        .file-input-wrapper span { font-size: 12px; color: var(--text-muted); }
        .file-input-wrapper input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

        /* ── TWEET ── */
        .tweet-textarea {
            width: 100%;
            min-height: 120px;
            resize: vertical;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }
        .tweet-textarea:focus { border-color: var(--primary); background: rgba(139, 92, 246, 0.1); }
        .tweet-footer { display: flex; align-items: center; justify-content: space-between; margin: 14px 0 20px; flex-wrap: wrap; gap: 12px; }
        .tweet-expira-toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #eee; cursor: pointer; }
        .tweet-expira-toggle input { accent-color: var(--primary); width: 16px; height: 16px; cursor: pointer; }
        .tweet-contador { font-size: 12px; color: var(--text-muted); }
        .tweet-contador.no-limite { color: #ef4444; }

        .btn-publish {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 12px;
            padding: 14px;
            color: white;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.2);
        }
        .btn-publish:hover { transform: translateY(-2px); box-shadow: 0 15px 30px rgba(139, 92, 246, 0.4); }
        .btn-publish:disabled { opacity: .6; cursor: not-allowed; }

        .msg-feedback {
            margin-top: 16px;
            font-size: 13px;
            text-align: center;
            padding: 12px;
            border-radius: 12px;
        }
        .msg-feedback.sucesso { color: #22c55e; background: rgba(34,197,94,.1); border: 1px solid rgba(34,197,94,.3); }
        .msg-feedback.erro { color: #ef4444; background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3); }

        .hidden { display: none !important; }

        @media (max-width: 560px) {
            .tabs { flex-direction: column; }
            .container { margin-top: 20px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <a href="index.html"><img src="../images/logo.png" alt="Backstage Logo" class="logo-img"></a>
        </div>
        <div class="header-center">
            <div class="header-search" onclick="window.location.href='pesquisar_usuarios.html?focar=true'">
                <i class="fas fa-search header-search-icon"></i>
                <input type="text" class="header-search-input" placeholder="Buscar músicos..." readonly>
                <button class="header-search-btn">Buscar</button>
            </div>
        </div>
        <div class="header-actions">
            <div class="profile-dropdown" id="profileDropdown">
                <div class="profile-trigger" id="profileTrigger"></div>
                <div class="dropdown-menu">
                    <a href="perfil.html" class="dropdown-item"><i class="fas fa-user"></i> Meu Perfil</a>
                    <a href="feed.html" class="dropdown-item"><i class="fas fa-stream"></i> Feed</a>
                    <a href="config.html" class="dropdown-item"><i class="fas fa-cog"></i> Configurações</a>
                    <div class="dropdown-divider"></div>
                    <div class="dropdown-item" id="btnSair"><i class="fas fa-sign-out-alt"></i> Sair</div>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <h1 class="page-title">Nova Postagem</h1>
        <p class="page-subtitle">Compartilhe uma prévia da sua música ou solte um tweet pra cena.</p>

        <div class="tabs">
            <button type="button" class="tab-btn active" data-tab="previa"><i class="fas fa-music"></i> Prévia de áudio</button>
            <button type="button" class="tab-btn" data-tab="tweet"><i class="fas fa-comment"></i> Tweet</button>
        </div>

        <div class="glass-card">
            <!-- ABA: PRÉVIA -->
            <div class="tab-panel active" id="painelPrevia">
                <form id="formNovaPrevia">
                    <div class="form-group">
                        <label>Título da Prévia</label>
                        <input type="text" id="previaNome" class="form-control" placeholder="Ex: Solo de Guitarra - Track 04" maxlength="60">
                    </div>

                    <div class="form-group">
                        <label>Arquivo de Áudio</label>
                        <div class="file-input-wrapper" id="fileWrapper">
                            <i class="fas fa-cloud-arrow-up"></i>
                            <span id="fileNameDisplay">Clique ou arraste o áudio</span>
                            <input type="file" id="previaArquivo" accept="audio/*" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Trecho da prévia (30s padrão)</label>
                        <div class="trimmer">
                            <p class="trimmer-hint">Selecione o arquivo para publicar.</p>
                        </div>
                        <input type="hidden" id="previaInicio" value="0">
                        <input type="hidden" id="previaDuracao" value="30">
                    </div>

                    <button type="submit" class="btn-publish" id="btnPublicarPrevia">
                        <i class="fas fa-upload"></i> PUBLICAR NA CENA
                    </button>
                </form>
                <p id="previaMsg" class="msg-feedback hidden"></p>
            </div>

            <!-- ABA: TWEET -->
            <div class="tab-panel" id="painelTweet">
                <form id="formNovoTweet">
                    <div class="form-group">
                        <label>O que tá rolando?</label>
                        <textarea id="tweetTexto" class="tweet-textarea" maxlength="280" placeholder="Fala pra cena o que você tá pensando, gravando, procurando..."></textarea>
                    </div>

                    <div class="tweet-footer">
                        <label class="tweet-expira-toggle">
                            <input type="checkbox" id="tweetExpira">
                            Some em 24h (senão fica permanente no seu perfil)
                        </label>
                        <span class="tweet-contador" id="tweetContador">280</span>
                    </div>

                    <button type="submit" class="btn-publish" id="btnPublicarTweet">
                        <i class="fas fa-paper-plane"></i> PUBLICAR TWEET
                    </button>
                </form>
                <p id="tweetMsg" class="msg-feedback hidden"></p>
            </div>
        </div>
    </div>

    <footer>
        <div class="footer-content">
            <img src="../images/logo.png" alt="Backstage Logo" class="footer-logo-img">
            <p>A cena musical independente começa aqui. &copy; 2025 Backstage Cena</p>
        </div>
    </footer>

    <script type="module">
        import { verificarAutenticacao, fazerLogout } from '../js/auth.js';
        import { criarPostagem, criarTweet } from '../js/postagens.js';

        document.addEventListener('DOMContentLoaded', () => {
            const usuarioLogado = verificarAutenticacao();
            if (!usuarioLogado) { window.location.href = 'login.html'; }
            
            const nomeUsuario = usuarioLogado?.nome_artistico || usuarioLogado?.nome_completo || '';
            const profileTrigger = document.getElementById('profileTrigger');
            if (profileTrigger) profileTrigger.textContent = nomeUsuario.substring(0, 2).toUpperCase();

            document.getElementById('btnSair')?.addEventListener('click', fazerLogout);
            
            const profileDropdown = document.getElementById('profileDropdown');
            profileDropdown?.addEventListener('click', (e) => {
                e.stopPropagation();
                profileDropdown.classList.toggle('active');
            });
            document.addEventListener('click', () => profileDropdown?.classList.remove('active'));

            // Lógica de Abas
            const tabBtns = document.querySelectorAll('.tab-btn');
            const tabPanels = document.querySelectorAll('.tab-panel');

            tabBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    const targetTab = btn.getAttribute('data-tab');
                    
                    tabBtns.forEach(b => b.classList.remove('active'));
                    tabPanels.forEach(p => p.classList.remove('active'));
                    
                    btn.classList.add('active');
                    const panel = document.getElementById(targetTab === 'previa' ? 'painelPrevia' : 'painelTweet');
                    if (panel) panel.classList.add('active');
                });
            });

            // Contador de Tweet
            const tweetTextarea = document.getElementById('tweetTexto');
            const tweetContador = document.getElementById('tweetContador');
            tweetTextarea?.addEventListener('input', () => {
                const restante = 280 - tweetTextarea.value.length;
                tweetContador.textContent = restante;
            });

            // Submit Tweet
            document.getElementById('formNovoTweet')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('btnPublicarTweet');
                const msgEl = document.getElementById('tweetMsg');
                const texto = tweetTextarea.value.trim();
                const expira = document.getElementById('tweetExpira').checked;

                if (!texto) return;
                
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> PUBLICANDO...';
                msgEl.className = 'msg-feedback hidden';

                try {
                    await criarTweet(texto, expira);
                    e.target.reset();
                    tweetContador.textContent = '280';
                    msgEl.textContent = 'Tweet publicado com sucesso!';
                    msgEl.className = 'msg-feedback sucesso';
                } catch (err) {
                    msgEl.textContent = err.message || 'Erro ao publicar tweet.';
                    msgEl.className = 'msg-feedback erro';
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-paper-plane"></i> PUBLICAR TWEET';
                }
            });

            // Submit Prévia
            document.getElementById('formNovaPrevia')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('btnPublicarPrevia');
                const msgEl = document.getElementById('previaMsg');
                const arquivo = document.getElementById('previaArquivo').files[0];
                const nome = document.getElementById('previaNome').value.trim();

                if (!arquivo) return;
                
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> PUBLICANDO...';
                msgEl.className = 'msg-feedback hidden';

                try {
                    await criarPostagem(arquivo, nome, 0, 30);
                    e.target.reset();
                    msgEl.textContent = 'Prévia publicada com sucesso!';
                    msgEl.className = 'msg-feedback sucesso';
                } catch (err) {
                    msgEl.textContent = err.message || 'Erro ao publicar prévia.';
                    msgEl.className = 'msg-feedback erro';
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-upload"></i> PUBLICAR NA CENA';
                }
            });
        });
    </script>
</body>
</html>
