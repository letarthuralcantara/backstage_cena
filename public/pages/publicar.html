<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Backstage | Nova Postagem</title>
    <meta name="description" content="Compartilhe uma nova faixa, vídeo ou novidade com a comunidade Backstage Cena.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="shortcut icon" href="../images/favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="../css/tokens.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="../css/publish.css">
    <link rel="stylesheet" href="../css/cropper.css">
</head>
<body>
    <header class="header">
        <div class="header-left">
            <a href="index.html"><img src="../images/logo.png" alt="Backstage Logo" class="logo-img"></a>
        </div>
        <div class="header-center">
            <div class="header-search" id="searchBar">
                <i class="fas fa-search header-search-icon"></i>
                <input type="text" class="header-search-input" placeholder="Buscar músicos..." readonly>
                <button class="header-search-btn">Buscar</button>
            </div>
        </div>
        <div class="header-actions">
            <div class="profile-dropdown" id="profileDropdown"></div>
        </div>
    </header>

    <div class="container">
        <h1 class="page-title">Nova postagem</h1>
        <p class="page-subtitle">Compartilhe uma prévia da sua música ou solte um tweet pra cena.</p>

        <div class="tabs segmented" role="group" aria-label="Tipo de postagem">
            <button type="button" class="tab-btn active" data-tab="previa">Prévia de áudio</button>
            <button type="button" class="tab-btn" data-tab="tweet">Tweet</button>
        </div>

        <div class="publish-card">
            <!-- ABA: PRÉVIA -->
            <div class="tab-panel active" id="painelPrevia">
                <form id="formNovaPrevia">
                    <div class="form-group">
                        <label for="previaNome">Título da prévia</label>
                        <input type="text" id="previaNome" class="form-control" placeholder="Ex: Solo de Guitarra - Track 04" maxlength="60">
                    </div>

                    <div class="form-group">
                        <label for="previaArquivo">Arquivo de áudio</label>
                        <div class="file-input-wrapper" id="fileWrapper">
                            <span id="fileNameDisplay">Clique ou arraste o áudio</span>
                            <input type="file" id="previaArquivo" accept="audio/*" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Trecho da prévia (30s padrão)</label>
                        <div class="trimmer">
                            <p class="trimmer-hint">Selecione o arquivo para publicar.</p>
                        </div>
                        <input type="hidden" id="previaInicio" value="0">
                        <input type="hidden" id="previaDuracao" value="30">
                    </div>

                    <button type="submit" class="btn-publish" id="btnPublicarPrevia">
                        Publicar prévia
                    </button>
                </form>
                <p id="previaMsg" class="msg-feedback hidden"></p>
            </div>

            <!-- ABA: TWEET -->
            <div class="tab-panel" id="painelTweet">
                <form id="formNovoTweet">
                    <div class="form-group">
                        <label for="tweetTexto">O que tá rolando?</label>
                        <textarea id="tweetTexto" class="tweet-textarea" maxlength="280" placeholder="Fala pra cena o que você tá pensando, gravando, procurando..."></textarea>
                    </div>

                    <div class="form-group">
                        <div class="tweet-imagem-acoes">
                            <button type="button" class="tweet-imagem-btn" id="tweetImagemEscolher">
                                Adicionar imagem
                            </button>
                            <input type="file" id="tweetImagem" accept="image/jpeg,image/png,image/gif" hidden>
                            <button type="button" class="tweet-imagem-editar hidden" id="tweetImagemEditar">Editar recorte</button>
                            <button type="button" class="tweet-imagem-remover hidden" id="tweetImagemRemover">Remover imagem</button>
                        </div>
                        <img id="tweetImagemPreview" class="tweet-imagem-preview hidden" alt="Pré-visualização da imagem do tweet">
                        <p id="tweetImagemErro" class="tweet-imagem-erro hidden" role="alert"></p>
                    </div>

                    <div class="tweet-footer">
                        <label class="tweet-expira-toggle">
                            <input type="checkbox" id="tweetExpira">
                            Some em 24h (senão fica permanente no seu perfil)
                        </label>
                        <span class="tweet-contador" id="tweetContador">280</span>
                    </div>

                    <button type="submit" class="btn-publish" id="btnPublicarTweet">
                        Publicar tweet
                    </button>
                </form>
                <p id="tweetMsg" class="msg-feedback hidden"></p>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <img src="../images/logo.png" alt="Backstage Logo" class="footer-logo-img">
                <p class="footer-note">A cena musical independente começa aqui. &copy; 2025 Backstage Cena</p>
                <a href="privacidade.html" class="footer-note">Política de Privacidade</a>
            </div>
        </div>
    </footer>

    <script type="module">
        import { verificarAutenticacao, aplicarErroApiNoCampo } from '../js/auth.js';
        import { initNavbar } from '../js/navbar.js';
        import { criarPostagem, criarTweet, validarImagemTweet } from '../js/postagens.js';
        import { abrirRecorte, validarImagemOriginal } from '../js/image-cropper.js';

        const toastApi = document.createElement('div');
        toastApi.className = 'api-toast';
        toastApi.setAttribute('role', 'status');
        document.body.appendChild(toastApi);
        let toastApiTimer;

        function mostrarToastApi(message, erro = false) {
            clearTimeout(toastApiTimer);
            toastApi.textContent = message;
            toastApi.classList.toggle('erro', erro);
            toastApi.classList.add('show');
            toastApiTimer = setTimeout(() => toastApi.classList.remove('show'), 4500);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const usuarioLogado = verificarAutenticacao();
            if (!usuarioLogado) { window.location.href = 'login.html'; }
            await initNavbar();

            // Lógica de Abas
            const tabBtns = document.querySelectorAll('.tab-btn');
            const tabPanels = document.querySelectorAll('.tab-panel');

            tabBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    const targetTab = btn.getAttribute('data-tab');
                    
                    tabBtns.forEach(b => b.classList.remove('active'));
                    tabPanels.forEach(p => p.classList.remove('active'));
                    
                    btn.classList.add('active');
                    const panel = document.getElementById(targetTab === 'previa' ? 'painelPrevia' : 'painelTweet');
                    if (panel) panel.classList.add('active');
                });
            });

            // Contador de Tweet
            const tweetTextarea = document.getElementById('tweetTexto');
            const tweetContador = document.getElementById('tweetContador');
            tweetTextarea?.addEventListener('input', () => {
                tweetTextarea.setCustomValidity('');
                const restante = 280 - tweetTextarea.value.length;
                tweetContador.textContent = restante;
            });

            const inputImagemTweet = document.getElementById('tweetImagem');
            const previewImagemTweet = document.getElementById('tweetImagemPreview');
            const botaoEditarImagemTweet = document.getElementById('tweetImagemEditar');
            const botaoRemoverImagemTweet = document.getElementById('tweetImagemRemover');
            const erroImagemTweet = document.getElementById('tweetImagemErro');
            let urlPreviewImagemTweet = null;
            let imagemTweetSelecionada = null;
            let imagemTweetOriginal = null;

            function limparImagemTweet() {
                if (urlPreviewImagemTweet) URL.revokeObjectURL(urlPreviewImagemTweet);
                urlPreviewImagemTweet = null;
                imagemTweetSelecionada = null;
                imagemTweetOriginal = null;
                inputImagemTweet.value = '';
                previewImagemTweet.removeAttribute('src');
                previewImagemTweet.classList.add('hidden');
                botaoEditarImagemTweet.classList.add('hidden');
                botaoRemoverImagemTweet.classList.add('hidden');
                erroImagemTweet.textContent = '';
                erroImagemTweet.classList.add('hidden');
            }

            document.getElementById('tweetImagemEscolher')?.addEventListener('click', () => inputImagemTweet.click());
            botaoRemoverImagemTweet?.addEventListener('click', limparImagemTweet);
            async function editarRecorteTweet(arquivo) {
                const recortado = await abrirRecorte(arquivo, {
                    proporcao: 'seletor',
                    saidaMax: 1600,
                    circular: false
                });
                if (!recortado) return null;
                const erro = validarImagemTweet(recortado);
                if (erro) throw new Error(erro);
                return recortado;
            }

            function mostrarImagemTweet(arquivo) {
                if (urlPreviewImagemTweet) URL.revokeObjectURL(urlPreviewImagemTweet);
                imagemTweetSelecionada = arquivo;
                urlPreviewImagemTweet = URL.createObjectURL(arquivo);
                previewImagemTweet.src = urlPreviewImagemTweet;
                previewImagemTweet.classList.remove('hidden');
                botaoEditarImagemTweet.classList.remove('hidden');
                botaoRemoverImagemTweet.classList.remove('hidden');
            }

            botaoEditarImagemTweet?.addEventListener('click', async () => {
                if (!imagemTweetOriginal) return;
                try {
                    const recortado = await editarRecorteTweet(imagemTweetOriginal);
                    if (recortado) mostrarImagemTweet(recortado);
                } catch (erro) {
                    erroImagemTweet.textContent = erro.message || 'Não foi possível recortar a imagem.';
                    erroImagemTweet.classList.remove('hidden');
                }
            });

            inputImagemTweet?.addEventListener('change', async () => {
                const imagem = inputImagemTweet.files[0];
                erroImagemTweet.textContent = '';
                erroImagemTweet.classList.add('hidden');
                if (!imagem) {
                    limparImagemTweet();
                    return;
                }

                const erro = validarImagemOriginal(imagem);
                if (erro) {
                    limparImagemTweet();
                    erroImagemTweet.textContent = erro;
                    erroImagemTweet.classList.remove('hidden');
                    return;
                }

                imagemTweetOriginal = imagem;
                try {
                    const recortado = await editarRecorteTweet(imagem);
                    if (!recortado) {
                        limparImagemTweet();
                        return;
                    }
                    mostrarImagemTweet(recortado);
                } catch (erroRecorte) {
                    limparImagemTweet();
                    erroImagemTweet.textContent = erroRecorte.message || 'Não foi possível recortar a imagem.';
                    erroImagemTweet.classList.remove('hidden');
                }
            });

            // Submit Tweet
            document.getElementById('formNovoTweet')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('btnPublicarTweet');
                const msgEl = document.getElementById('tweetMsg');
                const texto = tweetTextarea.value.trim();
                const expira = document.getElementById('tweetExpira').checked;
                const imagem = imagemTweetSelecionada;

                if (!texto) return;
                const erroImagem = imagem && validarImagemTweet(imagem);
                if (erroImagem) {
                    erroImagemTweet.textContent = erroImagem;
                    erroImagemTweet.classList.remove('hidden');
                    return;
                }
                
                btn.disabled = true;
                btn.textContent = 'Publicando...';
                msgEl.className = 'msg-feedback hidden';

                try {
                    await criarTweet(texto, expira, imagem);
                    e.target.reset();
                    limparImagemTweet();
                    tweetContador.textContent = '280';
                    msgEl.textContent = 'Tweet publicado com sucesso!';
                    msgEl.className = 'msg-feedback sucesso';
                } catch (err) {
                    aplicarErroApiNoCampo(err, { texto: 'tweetTexto' });
                    msgEl.textContent = err.message || 'Erro ao publicar tweet.';
                    msgEl.className = 'msg-feedback erro';
                    mostrarToastApi(err.message || 'Erro ao publicar tweet.', true);
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = 'Publicar tweet';
                }
            });

            // Trimmer: mostra o player e deixa escolher o trecho de 30s (ou
            // outra duração) assim que um arquivo de áudio é escolhido.
            const inputArquivo = document.getElementById('previaArquivo');
            const fileNameDisplay = document.getElementById('fileNameDisplay');
            const trimmer = document.querySelector('.trimmer');
            const inputInicio = document.getElementById('previaInicio');
            const inputDuracao = document.getElementById('previaDuracao');

            inputArquivo?.addEventListener('change', () => {
                inputArquivo.setCustomValidity('');
                const arquivo = inputArquivo.files[0];
                if (!arquivo) return;

                if (fileNameDisplay) fileNameDisplay.textContent = arquivo.name;

                const url = URL.createObjectURL(arquivo);
                trimmer.innerHTML = `
                    <audio id="trimmerAudio" src="${url}" preload="metadata"></audio>
                    <div class="trimmer-timeline" id="trimmerTimeline">
                        <div class="trimmer-fora" id="trimmerForaEsq" style="left:0;"></div>
                        <div class="trimmer-fora" id="trimmerForaDir" style="right:0;"></div>
                        <div class="trimmer-window" id="trimmerWindow">
                            <div class="trimmer-handle trimmer-handle-esq" id="trimmerHandleEsq"></div>
                            <div class="trimmer-handle trimmer-handle-dir" id="trimmerHandleDir"></div>
                        </div>
                        <div class="trimmer-playhead" id="trimmerPlayhead"></div>
                    </div>
                    <div class="trimmer-row">
                        <label>Duração</label>
                        <select id="trimmerDuracao">
                            <option value="15">15s</option>
                            <option value="30" selected>30s</option>
                            <option value="45">45s</option>
                            <option value="60">60s</option>
                        </select>
                    </div>
                    <p class="trimmer-tempo" id="trimmerTempo">Carregando duração...</p>
                    <button type="button" class="btn-ouvir-trecho" id="btnOuvirTrecho">
                        Ouvir trecho selecionado
                    </button>
                `;

                const audioEl = document.getElementById('trimmerAudio');
                const timeline = document.getElementById('trimmerTimeline');
                const janela = document.getElementById('trimmerWindow');
                const foraEsq = document.getElementById('trimmerForaEsq');
                const foraDir = document.getElementById('trimmerForaDir');
                const alcaEsq = document.getElementById('trimmerHandleEsq');
                const alcaDir = document.getElementById('trimmerHandleDir');
                const playhead = document.getElementById('trimmerPlayhead');
                const selectDuracao = document.getElementById('trimmerDuracao');
                const tempoLabel = document.getElementById('trimmerTempo');
                const btnOuvir = document.getElementById('btnOuvirTrecho');

                let duracaoAudio = 0;
                let inicio = 0; // segundos

                function formatarTempo(seg) {
                    seg = Math.max(0, Math.round(seg));
                    return `${Math.floor(seg / 60)}:${String(seg % 60).padStart(2, '0')}`;
                }

                // Redesenha a janela (posição + largura) a partir de inicio/duração,
                // em porcentagem da largura da timeline.
                function desenharJanela() {
                    const duracao = Math.min(Number(selectDuracao.value), Math.max(1, duracaoAudio));
                    const inicioPct = duracaoAudio ? (inicio / duracaoAudio) * 100 : 0;
                    const larguraPct = duracaoAudio ? (duracao / duracaoAudio) * 100 : 100;
                    janela.style.left = `${inicioPct}%`;
                    janela.style.width = `${larguraPct}%`;
                    foraEsq.style.width = `${inicioPct}%`;
                    foraDir.style.width = `${Math.max(0, 100 - inicioPct - larguraPct)}%`;

                    inputInicio.value = String(Math.round(inicio));
                    inputDuracao.value = String(Math.round(duracao));
                    tempoLabel.textContent = `De ${formatarTempo(inicio)} até ${formatarTempo(inicio + duracao)} (${Math.round(duracao)}s de ${formatarTempo(duracaoAudio)})`;
                }

                function limitarInicio(valor) {
                    const duracao = Number(selectDuracao.value);
                    return Math.max(0, Math.min(valor, Math.max(0, duracaoAudio - duracao)));
                }

                // Arrasta a janela inteira (segura no meio e desliza).
                function arrastarJanela(e) {
                    const rect = timeline.getBoundingClientRect();
                    const xInicial = e.clientX;
                    const inicioOriginal = inicio;
                    function mover(ev) {
                        const deltaPx = ev.clientX - xInicial;
                        const deltaSeg = (deltaPx / rect.width) * duracaoAudio;
                        inicio = limitarInicio(inicioOriginal + deltaSeg);
                        desenharJanela();
                    }
                    function soltar() {
                        document.removeEventListener('pointermove', mover);
                        document.removeEventListener('pointerup', soltar);
                    }
                    document.addEventListener('pointermove', mover);
                    document.addEventListener('pointerup', soltar);
                }

                // Arrasta só a alça esquerda: muda o início E a duração (o fim
                // fica fixo), com o mínimo de 1s e sem passar da alça direita.
                function arrastarAlcaEsquerda(e) {
                    e.stopPropagation();
                    const rect = timeline.getBoundingClientRect();
                    const fim = inicio + Number(selectDuracao.value);
                    function mover(ev) {
                        const pct = Math.max(0, Math.min(1, (ev.clientX - rect.left) / rect.width));
                        const novoInicio = Math.min(pct * duracaoAudio, fim - 1);
                        inicio = Math.max(0, novoInicio);
                        const novaDuracao = Math.max(1, Math.min(60, fim - inicio));
                        atualizarOpcaoDuracaoMaisProxima(novaDuracao);
                        desenharJanela();
                    }
                    function soltar() {
                        document.removeEventListener('pointermove', mover);
                        document.removeEventListener('pointerup', soltar);
                    }
                    document.addEventListener('pointermove', mover);
                    document.addEventListener('pointerup', soltar);
                }

                // Arrasta só a alça direita: início fica fixo, muda a duração.
                function arrastarAlcaDireita(e) {
                    e.stopPropagation();
                    const rect = timeline.getBoundingClientRect();
                    function mover(ev) {
                        const pct = Math.max(0, Math.min(1, (ev.clientX - rect.left) / rect.width));
                        const fimSeg = pct * duracaoAudio;
                        const novaDuracao = Math.max(1, Math.min(60, fimSeg - inicio));
                        atualizarOpcaoDuracaoMaisProxima(novaDuracao);
                        desenharJanela();
                    }
                    function soltar() {
                        document.removeEventListener('pointermove', mover);
                        document.removeEventListener('pointerup', soltar);
                    }
                    document.addEventListener('pointermove', mover);
                    document.addEventListener('pointerup', soltar);
                }

                // O <select> só tem 15/30/45/60 — ao arrastar uma alça, escolhe
                // a opção mais próxima da duração que o dedo/mouse pediu.
                function atualizarOpcaoDuracaoMaisProxima(duracaoAlvo) {
                    const opcoes = [15, 30, 45, 60];
                    const maisProxima = opcoes.reduce((a, b) => Math.abs(b - duracaoAlvo) < Math.abs(a - duracaoAlvo) ? b : a);
                    selectDuracao.value = String(maisProxima);
                }

                janela.addEventListener('pointerdown', arrastarJanela);
                alcaEsq.addEventListener('pointerdown', arrastarAlcaEsquerda);
                alcaDir.addEventListener('pointerdown', arrastarAlcaDireita);

                audioEl.addEventListener('loadedmetadata', () => {
                    duracaoAudio = audioEl.duration || 0;
                    inicio = limitarInicio(0);
                    desenharJanela();
                });
                selectDuracao.addEventListener('change', () => {
                    inicio = limitarInicio(inicio);
                    desenharJanela();
                });

                btnOuvir.addEventListener('click', () => {
                    audioEl.currentTime = inicio;
                    audioEl.play();
                    playhead.classList.add('show');
                    const duracao = Number(inputDuracao.value);

                    clearInterval(audioEl._intervaloPlayhead);
                    audioEl._intervaloPlayhead = setInterval(() => {
                        const pct = duracaoAudio ? (audioEl.currentTime / duracaoAudio) * 100 : 0;
                        playhead.style.left = `${pct}%`;
                    }, 50);

                    clearTimeout(audioEl._paradaTrecho);
                    audioEl._paradaTrecho = setTimeout(() => {
                        audioEl.pause();
                        clearInterval(audioEl._intervaloPlayhead);
                        playhead.classList.remove('show');
                    }, duracao * 1000);
                });
            });

            // Submit Prévia
            document.getElementById('formNovaPrevia')?.addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('btnPublicarPrevia');
                const msgEl = document.getElementById('previaMsg');
                const arquivo = document.getElementById('previaArquivo').files[0];
                const nome = document.getElementById('previaNome').value.trim();

                if (!arquivo) return;
                
                btn.disabled = true;
                btn.textContent = 'Publicando...';
                msgEl.className = 'msg-feedback hidden';

                try {
                    const inicio = Number(document.getElementById('previaInicio').value) || 0;
                    const duracao = Number(document.getElementById('previaDuracao').value) || 30;
                    await criarPostagem(arquivo, nome, inicio, duracao);
                    e.target.reset();
                    msgEl.textContent = 'Prévia publicada com sucesso!';
                    msgEl.className = 'msg-feedback sucesso';
                } catch (err) {
                    aplicarErroApiNoCampo(err, {
                        audio: 'previaArquivo',
                        titulo: 'previaNome',
                        inicio_seg: 'trimmerDuracao',
                        duracao_seg: 'trimmerDuracao',
                    });
                    msgEl.textContent = err.message || 'Erro ao publicar prévia.';
                    msgEl.className = 'msg-feedback erro';
                    mostrarToastApi(err.message || 'Erro ao publicar prévia.', true);
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = 'Publicar prévia';
                }
            });

        });
    </script>
    <div class="tab-bar-spacer"></div>
    <nav class="tab-bar" aria-label="Navegação principal"></nav>
</body>
</html>
