<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backstage | Meu Perfil</title>
    <link rel="shortcut icon" href="../images/favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/global.css">
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-glow: rgba(139, 92, 246, 0.4);
            --secondary: #d946ef;
            --accent-cyan: #06b6d4;
            --bg-dark: #050505;
            --bg-card: rgba(15, 15, 15, 0.6);
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-muted: #888;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            background-image:
                radial-gradient(circle at 10% 10%, rgba(139, 92, 246, 0.1), transparent 50%),
                radial-gradient(circle at 90% 90%, rgba(217, 70, 239, 0.08), transparent 50%);
            background-attachment: fixed;
        }

        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.3; }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 24px;
        }

        /* ── PROFILE LAYOUT ── */
        .profile-grid {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 32px;
            align-items: start;
        }

        /* ── SIDEBAR ── */
        .sidebar {
            position: sticky;
            top: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .glass-card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            padding: 24px;
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            border-color: rgba(139, 92, 246, 0.3);
        }

        .profile-header-card {
            text-align: center;
            padding-top: 40px;
        }

        .avatar-wrapper {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 20px;
        }

        .avatar-main {
            width: 100%;
            height: 100%;
            border-radius: 32px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 800;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), 0 0 20px var(--primary-glow);
            border: 2px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .avatar-main img { width: 100%; height: 100%; object-fit: cover; }

        .status-indicator {
            position: absolute;
            bottom: -5px;
            right: -5px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 4px solid #0f0f0f;
            z-index: 2;
        }
        .status-indicator.disponivel { background: #22c55e; box-shadow: 0 0 10px #22c55e; }
        .status-indicator.ocupado { background: #f59e0b; box-shadow: 0 0 10px #f59e0b; }
        .status-indicator.nao_perturbe { background: #ef4444; box-shadow: 0 0 10px #ef4444; }
        .status-indicator.invisivel { background: #6b7280; box-shadow: 0 0 10px #6b7280; }

        .profile-info h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .artist-area {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 8px;
            font-size: 11px;
            color: var(--primary);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }

        .stats-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
            padding: 16px 0;
            border-top: 1px solid var(--glass-border);
            border-bottom: 1px solid var(--glass-border);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-value { font-weight: 700; font-size: 16px; }
        .stat-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

        .quick-info {
            list-style: none;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .quick-info li {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: #ccc;
        }

        .quick-info i { color: var(--primary); width: 16px; text-align: center; }

        /* ── MAIN CONTENT ── */
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .section-title {
            font-family: 'Poppins', sans-serif;
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title i { color: var(--primary); }

        /* ── ADD PREVIEW ZONE (BACKSTAGE VIBE) ── */
        .backstage-panel {
            background: linear-gradient(135deg, rgba(139, 92, 246, 0.05), rgba(217, 70, 239, 0.05));
            border: 1px dashed rgba(139, 92, 246, 0.3);
            border-radius: 24px;
            padding: 32px;
            position: relative;
            overflow: hidden;
        }

        .backstage-panel::before {
            content: 'BACKSTAGE ACCESS';
            position: absolute;
            top: 10px;
            right: 10px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 40px;
            font-weight: 900;
            color: rgba(255,255,255,0.03);
            pointer-events: none;
            white-space: nowrap;
        }

        .upload-zone {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 11px;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-control {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px 16px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        .form-control:focus {
            border-color: var(--primary);
            background: rgba(139, 92, 246, 0.05);
        }

        .file-input-wrapper {
            position: relative;
            height: 100%;
            min-height: 100px;
            border: 2px dashed var(--glass-border);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .file-input-wrapper:hover {
            border-color: var(--primary);
            background: rgba(139, 92, 246, 0.05);
        }

        .file-input-wrapper i { font-size: 24px; color: var(--text-muted); }
        .file-input-wrapper span { font-size: 12px; color: var(--text-muted); }
        .file-input-wrapper input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

        .btn-publish {
            grid-column: 1 / -1;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border: none;
            border-radius: 12px;
            padding: 14px;
            color: white;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.2);
        }

        .btn-publish:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(139, 92, 246, 0.4);
        }

        /* ── PREVIEWS LIST ── */
        .previews-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }

        .story-thumb {
            aspect-ratio: 9/16;
            border-radius: 16px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
        }

        .story-thumb:hover {
            transform: scale(1.05);
            border-color: var(--primary);
        }

        .story-thumb-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, transparent 50%, rgba(0,0,0,0.8));
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
        }

        .story-thumb-title { font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* ── SKILLS TAGS ── */
        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .skill-tag {
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            font-size: 13px;
            color: #eee;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .skill-tag i { font-size: 12px; color: var(--primary); }

        /* ── RESPONSIVE ── */
        @media (max-width: 900px) {
            .profile-grid { grid-template-columns: 1fr; }
            .sidebar { position: static; }
        }

        @media (max-width: 600px) {
            .upload-zone { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <header class="header">
        <div class="header-left">
            <a href="index.html"><img src="../images/logo.png" alt="Backstage Logo" class="logo-img"></a>
        </div>
        <div class="header-center">
            <div class="header-search" id="searchBar" onclick="window.location.href='pesquisar_usuarios.html?focar=true'">
                <i class="fas fa-search header-search-icon"></i>
                <input type="text" class="header-search-input" placeholder="Buscar músicos..." readonly>
                <button class="header-search-btn">Buscar</button>
            </div>
        </div>
        <div class="header-actions">
            <div class="profile-dropdown" id="profileDropdown">
                <div class="profile-trigger" id="profileTrigger"></div>
                <div class="dropdown-menu">
                    <a href="perfil.html" class="dropdown-item"><i class="fas fa-user"></i> Meu Perfil</a>
                    <a href="feed.html" class="dropdown-item"><i class="fas fa-music"></i> Feed de Prévias</a>
                    <a href="config.html" class="dropdown-item"><i class="fas fa-cog"></i> Configurações</a>
                    <div class="dropdown-divider"></div>
                    <div class="dropdown-item" id="btnSair"><i class="fas fa-sign-out-alt"></i> Sair</div>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="profile-grid">
            <!-- SIDEBAR -->
            <aside class="sidebar">
                <div class="glass-card profile-header-card">
                    <div class="avatar-wrapper">
                        <div class="avatar-main" id="avatar"></div>
                        <div class="status-indicator" id="statusIndicator"></div>
                    </div>
                    <div class="profile-info">
                        <h1 id="nomeExibir">Carregando...</h1>
                        <span class="artist-area" id="areaBadge">Músico</span>
                        
                        <div class="stats-row">
                            <div class="stat-item">
                                <span class="stat-value" id="countPrevias">0</span>
                                <span class="stat-label">Prévias</span>
                            </div>
                            <div class="stat-item">
                                <span class="stat-value" id="expValue">0</span>
                                <span class="stat-label">Anos Exp.</span>
                            </div>
                        </div>

                        <ul class="quick-info">
                            <li><i class="fas fa-envelope"></i> <span id="emailExibir">---</span></li>
                            <li><i class="fas fa-map-marker-alt"></i> <span id="localExibir">---</span></li>
                            <li id="telefoneRow" class="hidden"><i class="fas fa-phone"></i> <span id="telefoneExibir">---</span></li>
                        </ul>
                    </div>
                </div>

                <div class="glass-card">
                    <h3 class="section-title" style="margin-bottom: 16px;"><i class="fas fa-share-nodes"></i> Redes Sociais</h3>
                    <div class="tags-container" id="socialLinks">
                        <!-- Links serão inseridos aqui -->
                    </div>
                </div>

                <button class="btn-publish" style="background: var(--glass); border: 1px solid var(--glass-border); box-shadow: none;" onclick="window.location.href='editar.html'">
                    <i class="fas fa-pen-to-square"></i> Editar Perfil
                </button>
            </aside>

            <!-- MAIN CONTENT -->
            <main class="main-content">
                <!-- BIO -->
                <div class="glass-card">
                    <div class="section-header">
                        <h2 class="section-title"><i class="fas fa-quote-left"></i> Sobre</h2>
                    </div>
                    <p id="bioExibir" style="color: #ccc; line-height: 1.6; font-size: 15px;"></p>
                </div>

                <!-- ADD PREVIEW (OWNER ONLY) -->
                <div class="backstage-panel hidden" id="addPreviaPanel">
                    <div class="section-header">
                        <h2 class="section-title"><i class="fas fa-bolt"></i> Backstage Pass</h2>
                        <span style="font-size: 10px; color: var(--primary); font-weight: 800; letter-spacing: 2px;">NOVA PRÉVIA</span>
                    </div>
                    
                    <form id="formNovaPrevia" class="upload-zone">
                        <div class="form-group">
                            <label>Título da Prévia</label>
                            <input type="text" id="previaNome" class="form-control" placeholder="Ex: Solo de Guitarra - Track 04" maxlength="60">
                            
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px;">
                                <div class="form-group">
                                    <label>Início (s)</label>
                                    <input type="number" id="previaInicio" class="form-control" value="0" min="0">
                                </div>
                                <div class="form-group">
                                    <label>Duração</label>
                                    <select id="previaDuracao" class="form-control">
                                        <option value="15">15 segundos</option>
                                        <option value="30" selected>30 segundos</option>
                                        <option value="45">45 segundos</option>
                                        <option value="60">60 segundos</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="form-group">
                            <label>Arquivo de Áudio</label>
                            <div class="file-input-wrapper" id="fileWrapper">
                                <i class="fas fa-cloud-arrow-up"></i>
                                <span id="fileNameDisplay">Clique ou arraste o áudio</span>
                                <input type="file" id="previaArquivo" accept="audio/*" required>
                            </div>
                        </div>

                        <button type="submit" class="btn-publish" id="btnPublicarPrevia">
                            <i class="fas fa-upload"></i> PUBLICAR NA CENA
                        </button>
                    </form>
                    <p id="previaMsg" class="hidden" style="margin-top: 16px; font-size: 12px; text-align: center; color: var(--accent-cyan);"></p>
                </div>

                <!-- PREVIEWS LIST -->
                <div class="glass-card">
                    <div class="section-header">
                        <h2 class="section-title"><i class="fas fa-music"></i> Prévias Ativas</h2>
                    </div>
                    <div id="previasLista" class="previews-grid">
                        <!-- Stories aqui -->
                    </div>
                </div>

                <!-- SKILLS & GEAR -->
                <div class="glass-card">
                    <h2 class="section-title" style="margin-bottom: 24px;"><i class="fas fa-layer-group"></i> Habilidades & Setup</h2>
                    
                    <div style="display: flex; flex-direction: column; gap: 20px;">
                        <div>
                            <label style="font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; display: block; margin-bottom: 12px;">Instrumentos</label>
                            <div class="tags-container" id="talentosCont"></div>
                        </div>
                        
                        <div>
                            <label style="font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; display: block; margin-bottom: 12px;">Gêneros</label>
                            <div class="tags-container" id="generosCont"></div>
                        </div>

                        <div id="dawsSection" class="hidden">
                            <label style="font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; display: block; margin-bottom: 12px;">Workstation (DAWs)</label>
                            <div class="tags-container" id="dawsCont"></div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <footer>
        <div class="footer-content">
            <img src="../images/logo.png" alt="Backstage Logo" class="footer-logo-img">
            <p>A cena musical independente começa aqui. &copy; 2025 Backstage Cena</p>
        </div>
    </footer>

    <script type="module">
        import { showLoading, hideLoading } from '../js/loading.js';
        import { verificarAutenticacao, fazerLogout } from '../js/auth.js';
        import { renderizarPostagensDoUsuario, criarPostagem } from '../js/postagens.js';

        const SOCIAL_ICONS = {
            instagram:'fa-brands fa-instagram', youtube:'fa-brands fa-youtube',
            spotify:'fa-brands fa-spotify', soundcloud:'fa-brands fa-soundcloud',
            tiktok:'fa-brands fa-tiktok', twitter:'fa-brands fa-x-twitter',
            site:'fa-solid fa-globe',
        };

        async function iniciarPerfil() {
            const params = new URLSearchParams(window.location.search);
            const idParam = params.get('id');
            const usuarioLogado = verificarAutenticacao(false);

            let u;
            try {
                if (idParam) {
                    const res = await fetch(`/api/usuarios/${idParam}`);
                    u = await res.json();
                } else {
                    if (!usuarioLogado) { window.location.href = 'login.html'; return; }
                    const res = await fetch(`/api/usuarios/${usuarioLogado.id_usuario}`);
                    u = await res.json();
                }
            } catch (e) { console.error(e); return; }

            const ehProprio = !idParam || String(usuarioLogado?.id_usuario) === String(u.id_usuario);

            // Render
            const nome = u.nome_artistico || u.nome_completo;
            document.getElementById('avatar').textContent = nome.substring(0,2).toUpperCase();
            document.getElementById('nomeExibir').textContent = nome;
            document.getElementById('emailExibir').textContent = u.email;
            document.getElementById('localExibir').textContent = [u.cidade, u.estado].filter(Boolean).join(', ') || 'Brasil';
            document.getElementById('expValue').textContent = u.anos_experiencia || '0';
            document.getElementById('bioExibir').textContent = u.biografia || 'Este artista ainda não escreveu sua biografia.';
            
            // Status
            const indicator = document.getElementById('statusIndicator');
            indicator.className = 'status-indicator ' + (u.status || 'disponivel');

            // Area
            const areas = Array.isArray(u.area_atuacao) ? u.area_atuacao : [];
            if (areas.length) document.getElementById('areaBadge').textContent = areas[0];

            // Tags
            const renderTags = (arr, containerId, icon) => {
                const cont = document.getElementById(containerId);
                cont.innerHTML = arr.length 
                    ? arr.map(t => `<span class="skill-tag"><i class="${icon}"></i>${t}</span>`).join('')
                    : '<span style="color:#555; font-size:12px;">Nenhum item adicionado</span>';
            };
            renderTags(u.instrumentos || [], 'talentosCont', 'fas fa-music');
            renderTags(u.generos || [], 'generosCont', 'fas fa-compact-disc');
            
            if (u.daws?.length) {
                document.getElementById('dawsSection').classList.remove('hidden');
                renderTags(u.daws, 'dawsCont', 'fas fa-sliders');
            }

            // Social
            const sociais = u.redes_sociais || {};
            const linksHtml = Object.entries(sociais).filter(([,v])=>v).map(([k,v])=>{
                const icon = SOCIAL_ICONS[k] || 'fa-solid fa-link';
                return `<a href="${v}" target="_blank" class="skill-tag" style="text-decoration:none;"><i class="${icon}"></i>${k}</a>`;
            }).join('');
            document.getElementById('socialLinks').innerHTML = linksHtml || '<span style="color:#555; font-size:12px;">Sem redes sociais</span>';

            // Previews
            if (ehProprio) document.getElementById('addPreviaPanel').classList.remove('hidden');
            renderizarPostagensDoUsuario(u.id_usuario, document.getElementById('previasLista'), (count) => {
                document.getElementById('countPrevias').textContent = count;
            });

            hideLoading();
        }

        // File input display
        document.getElementById('previaArquivo')?.addEventListener('change', (e) => {
            const fileName = e.target.files[0]?.name || 'Clique ou arraste o áudio';
            document.getElementById('fileNameDisplay').textContent = fileName;
            document.getElementById('fileWrapper').style.borderColor = 'var(--primary)';
        });

        // Form Submit
        document.getElementById('formNovaPrevia')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnPublicarPrevia');
            const msgEl = document.getElementById('previaMsg');
            const arquivo = document.getElementById('previaArquivo').files[0];
            const nome = document.getElementById('previaNome').value.trim();
            const inicio = Number(document.getElementById('previaInicio').value || 0);
            const duracao = Number(document.getElementById('previaDuracao').value || 30);

            if (!arquivo) return;

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> PUBLICANDO...';
            msgEl.classList.add('hidden');
            
            try {
                await criarPostagem(arquivo, nome, inicio, duracao);
                e.target.reset();
                document.getElementById('fileNameDisplay').textContent = 'Clique ou arraste o áudio';
                document.getElementById('fileWrapper').style.borderColor = 'var(--glass-border)';
                
                const params = new URLSearchParams(window.location.search);
                const idAtual = params.get('id') || verificarAutenticacao(false)?.id_usuario;
                renderizarPostagensDoUsuario(idAtual, document.getElementById('previasLista'), (count) => {
                    document.getElementById('countPrevias').textContent = count;
                });
                
                msgEl.textContent = 'PRÉVIA PUBLICADA COM SUCESSO!';
                msgEl.classList.remove('hidden');
            } catch (err) {
                msgEl.textContent = 'ERRO AO PUBLICAR PRÉVIA.';
                msgEl.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-upload"></i> PUBLICAR NA CENA';
            }
        });

        document.getElementById('btnSair')?.addEventListener('click', fazerLogout);
        document.getElementById('profileDropdown')?.addEventListener('click', () => 
            document.getElementById('profileDropdown').classList.toggle('active'));

        showLoading('Entrando no Backstage...');
        iniciarPerfil();
    </script>

    <script>
        // Partículas (Consistency)
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function initCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        class Particle {
            constructor() {
                this.x = Math.random()*canvas.width; this.y = Math.random()*canvas.height;
                this.size = Math.random()*2; this.speedX = Math.random()*0.5-0.25;
                this.speedY = Math.random()*0.5-0.25; this.opacity = Math.random()*0.5+0.1;
            }
            update() {
                this.x+=this.speedX; this.y+=this.speedY;
                if(this.x>canvas.width)this.x=0; if(this.x<0)this.x=canvas.width;
                if(this.y>canvas.height)this.y=0; if(this.y<0)this.y=canvas.height;
            }
            draw() {
                ctx.fillStyle=`rgba(139,92,246,${this.opacity})`;
                ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,Math.PI*2); ctx.fill();
            }
        }
        function createParticles() { for(let i=0;i<100;i++) particles.push(new Particle()); }
        function animate() {
            ctx.clearRect(0,0,canvas.width,canvas.height);
            particles.forEach(p=>{p.update();p.draw()});
            requestAnimationFrame(animate);
        }
        window.addEventListener('resize', initCanvas);
        initCanvas(); createParticles(); animate();
    </script>
</body>
</html>
