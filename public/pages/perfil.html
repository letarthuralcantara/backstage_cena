<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Backstage | Meu Perfil</title>
    <meta name="description" content="Gerencie seu perfil, portfólio e disponibilidade no Backstage Cena.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="shortcut icon" href="../images/favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/clubes.css">
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-glow: rgba(139, 92, 246, 0.4);
            --secondary: #d946ef;
            --accent-cyan: #06b6d4;
            --bg-dark: #050505;
            --bg-card: rgba(15, 15, 15, 0.6);
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-muted: #888;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            background-image:
                radial-gradient(circle at 10% 10%, rgba(139, 92, 246, 0.1), transparent 50%),
                radial-gradient(circle at 90% 90%, rgba(217, 70, 239, 0.08), transparent 50%);
            background-attachment: fixed;
        }

        #bg-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; opacity: 0.3; }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 24px;
        }

        /* ── PROFILE LAYOUT ── */
        .profile-grid {
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 32px;
            align-items: start;
        }

        /* ── SIDEBAR ── */
        .sidebar {
            position: sticky;
            top: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .glass-card {
            background: var(--bg-card);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            backdrop-filter: blur(20px);
            padding: 24px;
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            border-color: rgba(139, 92, 246, 0.3);
        }

        .profile-header-card {
            text-align: center;
            padding-top: 40px;
        }

        .avatar-wrapper {
            position: relative;
            width: 140px;
            height: 140px;
            margin: 0 auto 20px;
        }

        .avatar-main {
            width: 100%;
            height: 100%;
            border-radius: 32px;
            background: var(--glass-fill-strong);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: 800;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .avatar-main img { width: 100%; height: 100%; object-fit: cover; }
        .profile-trigger { overflow: hidden; }
        .profile-trigger img { width: 100%; height: 100%; object-fit: cover; border-radius: inherit; display: block; }

        .status-indicator {
            position: absolute;
            bottom: -5px;
            right: -5px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 4px solid #0f0f0f;
            z-index: 2;
        }
        .status-indicator.disponivel { background: #22c55e; box-shadow: 0 0 10px #22c55e; }
        .status-indicator.ocupado { background: #f59e0b; box-shadow: 0 0 10px #f59e0b; }
        .status-indicator.nao_perturbe { background: #ef4444; box-shadow: 0 0 10px #ef4444; }
        .status-indicator.invisivel { background: #6b7280; box-shadow: 0 0 10px #6b7280; }

        .profile-info h1 {
            font-family: 'Poppins', sans-serif;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .artist-area {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(139, 92, 246, 0.1);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 8px;
            font-size: 11px;
            color: var(--primary);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }

        /* ── STATUS (badge + seletor) ── */
        .status-badge-wrap { position: relative; display: inline-block; margin-bottom: 16px; }
        .status-badge {
            display: inline-flex; align-items: center; gap: 7px;
            padding: 5px 12px; border-radius: 20px;
            background: var(--glass); border: 1px solid var(--glass-border);
            font-size: 12px; color: #9ca3af;
            transition: all .2s; font-family: 'Inter', sans-serif;
        }
        .status-badge.is-editable { cursor: pointer; }
        .status-badge.is-editable:hover { border-color: var(--primary); color: #e5e7eb; }
        .status-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
        .status-dot.disponivel   { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
        .status-dot.ocupado      { background: #f59e0b; box-shadow: 0 0 8px #f59e0b; }
        .status-dot.nao_perturbe { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
        .status-dot.invisivel    { background: #6b7280; box-shadow: 0 0 8px #6b7280; }
        .status-chevron { font-size: 9px; margin-left: 2px; color: #666; }

        .status-dropdown {
            position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%);
            background: rgba(10,10,10,0.97); backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border); border-radius: 16px;
            padding: 8px; min-width: 190px; z-index: 200;
            display: none; flex-direction: column; gap: 2px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
        }
        .status-dropdown.open { display: flex; }
        .status-option {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 14px; border-radius: 10px; cursor: pointer;
            font-size: 13px; color: #ccc; transition: background .2s;
            border: none; background: transparent; font-family: 'Inter', sans-serif;
            width: 100%; text-align: left;
        }
        .status-option:hover { background: rgba(139,92,246,.12); color: white; }
        .status-option .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

        .perfil-bio {
            display: grid;
            gap: 8px;
            margin-top: 4px;
            text-align: left;
        }

        .perfil-bio p {
            color: #ccc;
            line-height: 1.6;
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        .perfil-clubes {
            display: grid;
            gap: 10px;
            margin: 4px 0 20px;
            padding: 16px 0;
            border-top: 1px solid var(--glass-border);
            border-bottom: 1px solid var(--glass-border);
        }

        .stat-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

        .quick-info {
            list-style: none;
            text-align: left;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .quick-info li {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            color: #ccc;
        }

        .quick-info i { color: var(--primary); width: 16px; text-align: center; }

        /* ── MAIN CONTENT ── */
        .main-content {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .section-title {
            font-family: 'Poppins', sans-serif;
            font-size: 18px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title i { color: var(--primary); }

        /* ── ADD PREVIEW ZONE (BACKSTAGE VIBE) ── */
        .backstage-panel {
            background: var(--glass-fill);
            border: 1px dashed rgba(139, 92, 246, 0.3);
            border-radius: 24px;
            padding: 32px;
            position: relative;
            overflow: hidden;
        }

        .backstage-panel::before {
            content: 'BACKSTAGE ACCESS';
            position: absolute;
            top: 10px;
            right: 10px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 40px;
            font-weight: 900;
            color: rgba(255,255,255,0.03);
            pointer-events: none;
            white-space: nowrap;
        }

        .upload-zone {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 11px;
            font-weight: 700;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-control {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px 16px;
            color: white;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            transition: all 0.3s;
        }

        .form-control:focus {
            border-color: var(--primary);
            background: rgba(139, 92, 246, 0.05);
        }

        .file-input-wrapper {
            position: relative;
            height: 100%;
            min-height: 100px;
            border: 2px dashed var(--glass-border);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .file-input-wrapper:hover {
            border-color: var(--primary);
            background: rgba(139, 92, 246, 0.05);
        }

        .file-input-wrapper i { font-size: 24px; color: var(--text-muted); }
        .file-input-wrapper span { font-size: 12px; color: var(--text-muted); }
        .file-input-wrapper input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

        /* ── TRIMMER (seletor visual do trecho) ── */
        .trimmer {
            background: rgba(0,0,0,0.3);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 16px;
        }
        .trimmer-hint {
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
            padding: 26px 10px;
        }
        .waveform-wrap {
            position: relative;
            width: 100%;
            height: 72px;
            touch-action: none;
        }
        .waveform-wrap canvas {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 8px;
        }
        .waveform-selection {
            position: absolute;
            top: 0; bottom: 0; left: 0; width: 30%;
            background: rgba(139, 92, 246, 0.28);
            border: 2px solid var(--primary);
            border-radius: 6px;
            cursor: grab;
        }
        .waveform-selection:active { cursor: grabbing; }
        .waveform-handle {
            position: absolute;
            top: 0; bottom: 0; width: 16px;
            background: var(--primary);
            border-radius: 4px;
            cursor: ew-resize;
        }
        .waveform-handle::after {
            content: '';
            position: absolute; top: 50%; left: 50%;
            width: 2px; height: 14px;
            background: rgba(255,255,255,.7);
            transform: translate(-50%, -50%);
            border-radius: 2px;
        }
        .waveform-handle-left { left: -8px; }
        .waveform-handle-right { right: -8px; }
        .trimmer-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 14px;
            flex-wrap: wrap;
        }
        .trimmer-duration-buttons { display: flex; gap: 6px; }
        .dur-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            color: #aaa;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
            transition: all .2s;
            font-family: 'Inter', sans-serif;
        }
        .dur-btn.active, .dur-btn:hover { border-color: var(--primary); color: white; background: rgba(139,92,246,.15); }
        .btn-preview-trim {
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            color: #eee;
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Inter', sans-serif;
            transition: all .2s;
        }
        .btn-preview-trim:hover { border-color: var(--primary); }
        .btn-preview-trim:disabled { opacity: .4; cursor: not-allowed; }

        .btn-publish {
            grid-column: 1 / -1;
            background: var(--accent);
            border: none;
            border-radius: 12px;
            padding: 14px;
            color: white;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s;
            box-shadow: 0 10px 20px rgba(139, 92, 246, 0.2);
        }

        .btn-publish:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(139, 92, 246, 0.4);
        }

        /* ── PROFILE POSTS ── */
        .previews-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .perfil-post {
            display: grid;
            gap: 12px;
            padding: 16px;
            text-align: left;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
        }

        .perfil-post-cabecalho {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .perfil-post-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(139, 92, 246, 0.2);
            color: #c4b5fd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            flex-shrink: 0;
            overflow: hidden;
        }
        .profile-section-tabs { display:flex; gap:8px; margin-bottom:14px; }
        .profile-section-tabs button { padding:9px 13px; border:1px solid var(--glass-border); border-radius:999px; background:var(--glass); color:#aaa; cursor:pointer; }
        .profile-section-tabs button.active { color:white; border-color:var(--primary); background:rgba(139,92,246,.15); }
        .profile-workons { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:12px; }
        .profile-workons .workon-card { display:block; overflow:hidden; color:inherit; text-decoration:none; border:1px solid var(--glass-border); border-radius:14px; background:var(--glass); }
        .profile-workons .workon-card img,.profile-workons .workon-card-placeholder { width:100%; height:105px; display:grid; place-items:center; object-fit:cover; background:rgba(255,255,255,.05); }
        .profile-workons .workon-card-info { display:grid; gap:5px; padding:11px; }
        .profile-workons .workon-card-info span { color:#999; font-size:11px; }
        .music-profile-card { padding:20px; }
        .music-profile-section + .music-profile-section { margin-top:24px; padding-top:20px; border-top:1px solid var(--glass-border); }
        .music-profile-heading { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
        .music-profile-heading h3 { font-family:'Poppins',sans-serif; font-size:16px; }
        .music-profile-heading select { max-width:190px; padding:8px 10px; border:1px solid var(--glass-border); border-radius:10px; background:#111; color:white; }
        .music-now-playing { display:flex; align-items:center; gap:14px; }
        .music-cover-wrap { position:relative; width:68px; height:68px; flex:none; overflow:hidden; border-radius:10px; background:rgba(255,255,255,.06); display:grid; place-items:center; }
        .music-cover { width:100%; height:100%; object-fit:cover; }
        .music-cover-placeholder { color:#a78bfa; font-size:30px; }
        .music-equalizer { position:absolute; right:4px; bottom:4px; display:flex; align-items:end; gap:2px; height:18px; padding:3px; border-radius:5px; background:rgba(0,0,0,.7); }
        .music-equalizer i { width:3px; height:6px; background:#a78bfa; animation:music-wave .7s ease-in-out infinite alternate; }
        .music-equalizer i:nth-child(2) { height:12px; animation-delay:.2s; }
        .music-equalizer i:nth-child(3) { height:8px; animation-delay:.4s; }
        @keyframes music-wave { to { transform:scaleY(.35); } }
        .music-now-info { min-width:0; flex:1; display:grid; gap:4px; }
        .music-track-title { color:white; overflow-wrap:anywhere; }
        .music-track-artist,.music-track-album,.music-attribution { color:#999; font-size:12px; overflow-wrap:anywhere; }
        .music-progress { height:4px; margin-top:6px; overflow:hidden; border-radius:4px; background:rgba(255,255,255,.12); }
        .music-progress-bar { display:block; height:100%; background:#a78bfa; }
        .music-open-link { color:#c4b5fd; font-size:12px; text-decoration:none; white-space:nowrap; }
        .music-empty-state { color:#aaa; font-size:13px; padding:8px 0; }
        .music-top-list { display:grid; gap:10px; }
        .music-top-item { display:flex; align-items:center; gap:10px; min-width:0; }
        .music-top-rank { color:#999; width:20px; text-align:center; }
        .music-top-image { width:42px; height:42px; flex:none; overflow:hidden; display:grid; place-items:center; border-radius:8px; background:rgba(255,255,255,.06); color:#a78bfa; }
        .music-top-image .music-cover { width:100%; height:100%; }
        .music-top-text { display:grid; gap:3px; min-width:0; flex:1; overflow-wrap:anywhere; font-size:13px; }
        .music-top-text span { color:#999; font-size:11px; }

        .perfil-post-autor {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .perfil-post-autor strong { font-size: 13px; }
        .perfil-post-autor span { color: var(--text-muted); font-size: 11px; }
        .perfil-post-texto { color: #eee; font-size: 14px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }

        .perfil-post-audio {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 11px 12px;
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            background: var(--glass-fill-strong);
            color: #fff;
            font: inherit;
            text-align: left;
            cursor: pointer;
        }

        .perfil-post-audio:hover { border-color: var(--primary); }
        .perfil-post-audio-icone { display: flex; flex-shrink: 0; }
        .perfil-post-audio-titulo { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
        .perfil-post-audio-duracao { color: var(--text-muted); font-size: 12px; flex-shrink: 0; }

        /* ── SKILLS TAGS ── */
        .tags-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .skill-tag {
            padding: 6px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            font-size: 13px;
            color: #eee;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .skill-tag i { font-size: 12px; color: var(--primary); }

        /* ── RESPONSIVE ── */
        @media (max-width: 900px) {
            .profile-grid { grid-template-columns: 1fr; }
            .sidebar { position: static; }
        }

        @media (max-width: 600px) {
            .upload-zone { grid-template-columns: 1fr; }
            .trimmer-footer { flex-direction: column; align-items: stretch; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <a href="index.html"><img src="../images/logo.png" alt="Backstage Logo" class="logo-img"></a>
        </div>
        <div class="header-center">
            <div class="header-search" id="searchBar">
                <i class="fas fa-search header-search-icon"></i>
                <input type="text" class="header-search-input" placeholder="Buscar músicos..." readonly>
                <button class="header-search-btn">Buscar</button>
            </div>
        </div>
        <div class="header-actions">
            <div class="profile-dropdown" id="profileDropdown"></div>
        </div>
    </header>

    <div class="container">
        <div class="profile-grid">
            <!-- SIDEBAR -->
            <aside class="sidebar">
                <div class="glass-card profile-header-card">
                    <div class="avatar-wrapper">
                        <div class="avatar-main" id="avatar"></div>
                        <div class="status-indicator" id="statusIndicator"></div>
                    </div>
                    <div class="profile-info">
                        <h1 id="nomeExibir">Carregando...</h1>
                        <span class="artist-area" id="areaBadge">Músico</span>

                        <div class="status-badge-wrap">
                            <button type="button" class="status-badge" id="statusBadge">
                                <span class="status-dot" id="statusDot"></span>
                                <span id="statusLabel">---</span>
                                <i class="fas fa-chevron-down status-chevron hidden" id="statusChevron"></i>
                            </button>
                            <div class="status-dropdown" id="statusDropdown">
                                <button type="button" class="status-option" data-status="disponivel"><span class="dot" style="background:#22c55e;"></span>Disponível</button>
                                <button type="button" class="status-option" data-status="ocupado"><span class="dot" style="background:#f59e0b;"></span>Ocupado</button>
                                <button type="button" class="status-option" data-status="nao_perturbe"><span class="dot" style="background:#ef4444;"></span>Não perturbe</button>
                                <button type="button" class="status-option" data-status="invisivel"><span class="dot" style="background:#6b7280;"></span>Invisível</button>
                            </div>
                        </div>

                        <div class="perfil-bio">
                            <span class="stat-label">Biografia</span>
                            <p id="bioExibir"></p>
                        </div>

                        <div class="perfil-clubes">
                            <span class="stat-label">Clubes</span>
                            <div class="clube-chips" id="clubesLista"></div>
                        </div>

                        <ul class="quick-info">
                            <li><i class="fas fa-envelope"></i> <span id="emailExibir">---</span></li>
                            <li><i class="fas fa-map-marker-alt"></i> <span id="localExibir">---</span></li>
                            <li id="telefoneRow" class="hidden"><i class="fas fa-phone"></i> <span id="telefoneExibir">---</span></li>
                        </ul>

                        <div class="perfil-habilidades" style="display: flex; flex-direction: column; gap: 20px; margin-top: 20px; text-align: left;">
                            <div>
                                <label style="font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; display: block; margin-bottom: 12px;">Instrumentos</label>
                                <div class="tags-container" id="talentosCont"></div>
                            </div>

                            <div>
                                <label style="font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; display: block; margin-bottom: 12px;">Gêneros</label>
                                <div class="tags-container" id="generosCont"></div>
                            </div>

                            <div id="dawsSection" class="hidden">
                                <label style="font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; display: block; margin-bottom: 12px;">Workstation (DAWs)</label>
                                <div class="tags-container" id="dawsCont"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="glass-card">
                    <h3 class="section-title" style="margin-bottom: 16px;"><i class="fas fa-share-nodes"></i> Redes Sociais</h3>
                    <div class="tags-container" id="socialLinks">
                        <!-- Links serão inseridos aqui -->
                    </div>
                </div>

                <button class="btn-publish hidden" id="btnEditarPerfil" style="background: var(--glass); border: 1px solid var(--glass-border); box-shadow: none;">
                    <i class="fas fa-pen-to-square"></i> Editar Perfil
                </button>
            </aside>

            <!-- MAIN CONTENT -->
            <main class="main-content">
                <section class="glass-card music-profile-card" aria-label="Música">
                    <div class="music-profile-section">
                        <div class="music-profile-heading">
                            <h3><i class="fas fa-wave-square"></i> Ouvindo agora</h3>
                        </div>
                        <div id="musicaAgora" aria-live="polite"><p class="music-empty-state">Carregando atividade musical...</p></div>
                    </div>
                    <div class="music-profile-section">
                        <div class="music-profile-heading">
                            <h3>Mais ouvidos</h3>
                            <select id="periodoMusica" aria-label="Período dos mais ouvidos">
                                <option value="curto">Últimas 4 semanas</option>
                                <option value="medio">Últimos 6 meses</option>
                                <option value="longo">Últimos 12 meses</option>
                            </select>
                        </div>
                        <div class="profile-section-tabs" role="tablist" aria-label="Mais ouvidos">
                            <button type="button" class="active" role="tab" aria-selected="true" data-music-type="artistas">Artistas</button>
                            <button type="button" role="tab" aria-selected="false" data-music-type="faixas">Músicas</button>
                        </div>
                        <div id="musicaTop" aria-live="polite"><p class="music-empty-state">Carregando mais ouvidos...</p></div>
                    </div>
                </section>

                <!-- ADD PREVIEW (OWNER ONLY) -->
                <a href="publicar.html" class="backstage-panel hidden" id="addPreviaPanel" style="display:flex; align-items:center; justify-content:space-between; text-decoration:none; color:inherit; cursor:pointer;">
                    <div class="section-header" style="margin-bottom:0;">
                        <h2 class="section-title"><i class="fas fa-plus"></i> Backstage Post</h2>
                        <span style="font-size: 10px; color: var(--primary); font-weight: 800; letter-spacing: 2px;"></span>
                    </div>
                    <i class="fas fa-arrow-right" style="color: var(--primary); font-size: 20px;"></i>
                </a>

                <div class="profile-section-tabs" role="tablist" aria-label="Conteúdo do perfil">
                    <button type="button" class="active" role="tab" aria-selected="true" data-profile-tab="postagens">Postagens</button>
                    <button type="button" role="tab" aria-selected="false" data-profile-tab="workons">Work Ons</button>
                </div>

                <!-- PREVIEWS LIST -->
                <div class="glass-card" id="painelPostagens">
                    <div class="section-header">
                        <h2 class="section-title"><i class="fas fa-stream"></i> Postagens</h2>
                    </div>
                    <div id="previasLista" class="previews-grid">
                        <!-- Stories aqui -->
                    </div>
                </div>
                <div class="glass-card" id="painelWorkOns" hidden>
                    <div class="section-header">
                        <h2 class="section-title"><i class="fas fa-compact-disc"></i> Work Ons</h2>
                    </div>
                    <div id="workOnsPerfil" class="profile-workons" aria-live="polite"></div>
                </div>

            </main>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <img src="../images/logo.png" alt="Backstage Logo" class="footer-logo-img">
                <p style="color:rgba(255,255,255,0.4);font-size:13px;">A cena musical independente começa aqui. &copy; 2025 Backstage Cena</p>
                <a href="privacidade.html" style="color:rgba(255,255,255,0.4);font-size:13px;">Política de Privacidade</a>
            </div>
        </div>
    </footer>

    <script type="module">
        import { showLoading, hideLoading } from '../js/loading.js';
        import { authHeaders } from '../js/auth.js';
        import { ClubesAPI, iconeTipo } from '../js/clubes.js';
        import { carregarUsuariosPerfil, renderizarIdentidadePerfil } from '../js/perfil.js';
        import { renderizarPostagensDoUsuario } from '../js/postagens.js';
        import { renderizarWorkOnsDoUsuario } from '../js/workon.js';
        import {
            atrasoRetryAfter,
            atualizarBarraProgressoMusica,
            consultasMusicaisAtivas,
            renderizarAgoraMusica,
            renderizarTopMusica,
        } from '../js/musica.js';

        const SOCIAL_ICONS = {
            instagram:'fa-brands fa-instagram', youtube:'fa-brands fa-youtube',
            spotify:'fa-brands fa-spotify', soundcloud:'fa-brands fa-soundcloud',
            tiktok:'fa-brands fa-tiktok', twitter:'fa-brands fa-x-twitter',
            site:'fa-solid fa-globe',
        };

        const STATUS_MAP = {
            disponivel:   { label: 'Disponível',   cls: 'disponivel' },
            ocupado:      { label: 'Ocupado',      cls: 'ocupado' },
            nao_perturbe: { label: 'Não perturbe', cls: 'nao_perturbe' },
            invisivel:    { label: 'Invisível',    cls: 'invisivel' },
        };

        function calcularFaltantesPerfil(usuarioVisto) {
            const faltando = [];
            if (!usuarioVisto.instrumentos || usuarioVisto.instrumentos.length === 0) faltando.push('pelo menos 1 instrumento');
            if (!usuarioVisto.generos || usuarioVisto.generos.length === 0) faltando.push('pelo menos 1 gênero');
            if (!usuarioVisto.estado) faltando.push('estado');
            const bio = (usuarioVisto.biografia || '').trim();
            if (bio.length < 20) faltando.push('biografia com mínimo 20 caracteres');
            const areas = Array.isArray(usuarioVisto.area_atuacao) ? usuarioVisto.area_atuacao : (usuarioVisto.area_atuacao ? [usuarioVisto.area_atuacao] : []);
            if (areas.length === 0) faltando.push('área de atuação');
            return faltando;
        }

        function aplicarStatus(status) {
            const s = STATUS_MAP[status] || STATUS_MAP['disponivel'];
            document.getElementById('statusIndicator').className = 'status-indicator ' + s.cls;
            document.getElementById('statusDot').className = 'status-dot ' + s.cls;
            document.getElementById('statusLabel').textContent = s.label;
        }

        let idUsuarioAtual = null;

        function iniciarMusicaPerfil(idUsuario) {
            const card = document.querySelector('.music-profile-card');
            const container = document.getElementById('musicaAgora');
            let cardVisivel = false;
            let carregando = false;
            let temporizador = null;
            let progressoTimer = null;
            let proximoIntervalo = 15_000;

            const ativa = () => consultasMusicaisAtivas(document.visibilityState === 'visible', cardVisivel);
            const pararTimers = () => {
                clearTimeout(temporizador);
                clearInterval(progressoTimer);
                temporizador = null;
                progressoTimer = null;
            };
            const agendar = () => {
                if (!ativa() || carregando || temporizador) return;
                temporizador = setTimeout(() => {
                    temporizador = null;
                    carregarAgora();
                }, proximoIntervalo);
            };
            async function carregarAgora() {
                if (!ativa() || carregando) return;
                carregando = true;
                try {
                    const response = await fetch(`/api/musica/usuario/${idUsuario}/agora`, { headers: authHeaders() });
                    if (response.status === 429) {
                        proximoIntervalo = atrasoRetryAfter(response.headers.get('Retry-After'));
                        renderizarAgoraMusica(container, { conectado: true, estado: 'limite_atingido' });
                    } else {
                        const dados = await response.json();
                        if (!response.ok) throw new Error(dados.erro || 'Não foi possível carregar a atividade musical.');
                        proximoIntervalo = 15_000;
                        renderizarAgoraMusica(container, dados);
                    }
                    clearInterval(progressoTimer);
                    progressoTimer = ativa()
                        ? setInterval(() => atualizarBarraProgressoMusica(container), 1000)
                        : null;
                } catch (error) {
                    container.textContent = error.message || 'Não foi possível carregar a atividade musical.';
                } finally {
                    carregando = false;
                    agendar();
                }
            }
            const sincronizar = () => {
                if (!ativa()) {
                    pararTimers();
                    return;
                }
                if (!progressoTimer) {
                    progressoTimer = setInterval(() => atualizarBarraProgressoMusica(container), 1000);
                }
                if (!carregando && !temporizador) carregarAgora();
            };

            if ('IntersectionObserver' in window) {
                const observer = new IntersectionObserver((entries) => {
                    cardVisivel = Boolean(entries[0]?.isIntersecting);
                    sincronizar();
                });
                observer.observe(card);
                window.addEventListener('pagehide', () => observer.disconnect(), { once: true });
            } else {
                cardVisivel = card.getBoundingClientRect().bottom > 0 && card.getBoundingClientRect().top < window.innerHeight;
                sincronizar();
            }
            document.addEventListener('visibilitychange', sincronizar);
            window.addEventListener('pagehide', pararTimers, { once: true });
        }

        async function carregarMaisOuvidos(idUsuario) {
            const tipo = document.querySelector('[data-music-type].active')?.dataset.musicType || 'artistas';
            const periodo = document.getElementById('periodoMusica').value;
            const container = document.getElementById('musicaTop');
            container.textContent = 'Carregando mais ouvidos...';
            try {
                const query = new URLSearchParams({ tipo, periodo, limite: '10' });
                const response = await fetch(`/api/musica/usuario/${idUsuario}/top?${query}`, { headers: authHeaders() });
                const dados = await response.json();
                if (!response.ok) {
                    if (response.status === 429) {
                        renderizarTopMusica(container, { conectado: true, estado: 'limite_atingido' });
                        return;
                    }
                    throw new Error(dados.erro || 'Não foi possível carregar os mais ouvidos.');
                }
                renderizarTopMusica(container, dados);
            } catch (error) {
                container.textContent = error.message || 'Não foi possível carregar os mais ouvidos.';
            }
        }

        async function iniciarPerfil() {
            const params = new URLSearchParams(window.location.search);
            const idParam = params.get('id');
            let usuarioVisto;
            let ehProprio;
            try {
                ({ usuarioVisto, ehProprio } = await carregarUsuariosPerfil(idParam));
            } catch (e) { console.error(e); return; }
            if (!usuarioVisto) { window.location.href = 'login.html'; return; }

            idUsuarioAtual = usuarioVisto.id_usuario;
            iniciarMusicaPerfil(idUsuarioAtual);
            carregarMaisOuvidos(idUsuarioAtual);
            document.getElementById('btnEditarPerfil')?.classList.toggle('hidden', !ehProprio);

            // Render
            renderizarIdentidadePerfil(usuarioVisto);

            // Clubes de que a pessoa participa (dado público, como o resto do perfil).
            (async () => {
                const lista = document.getElementById('clubesLista');
                const clubes = await ClubesAPI.doUsuario(usuarioVisto.id_usuario).catch(() => []);
                if (!clubes.length) {
                    lista.innerHTML = '<p style="color: var(--text-2); font-size: 14px;">Ainda não participa de nenhum clube.</p>';
                    return;
                }
                clubes.forEach((c) => {
                    const a = document.createElement('a');
                    a.className = 'clube-chip';
                    a.href = `clube.html?id=${c.id_clube}`;
                    if (c.imagem) {
                        const imagem = document.createElement('img');
                        imagem.className = 'clube-chip-imagem';
                        imagem.src = c.imagem;
                        imagem.alt = '';
                        a.appendChild(imagem);
                    } else {
                        const icone = document.createElement('i');
                        icone.className = `fas ${iconeTipo(c.tipo)}`;
                        a.appendChild(icone);
                    }
                    a.appendChild(document.createTextNode(c.nome));
                    lista.appendChild(a);
                });
            })();
            document.getElementById('localExibir').textContent = [usuarioVisto.cidade, usuarioVisto.estado].filter(Boolean).join(', ') || 'Brasil';
            document.getElementById('bioExibir').textContent = usuarioVisto.biografia || 'Este artista ainda não escreveu sua biografia.';

            // Status
            aplicarStatus(usuarioVisto.status || 'disponivel');
            if (ehProprio) {
                document.getElementById('statusBadge').classList.add('is-editable');
                document.getElementById('statusChevron').classList.remove('hidden');
            }

            if (ehProprio) {
                const faltando = calcularFaltantesPerfil(usuarioVisto);
                if (faltando.length > 0) {
                    const container = document.querySelector('.container');
                    if (container && !document.getElementById('perfilBannerIncompleto')) {
                        const banner = document.createElement('div');
                        banner.id = 'perfilBannerIncompleto';
                        banner.style.cssText = `
                            background: rgba(139,92,246,0.15);
                            border: 1px solid rgba(139,92,246,0.4);
                            border-radius: 12px;
                            padding: 16px 20px;
                            margin: 0 0 24px;
                        `;
                        banner.innerHTML = `
                            <div style="display:flex; align-items:flex-start; gap:12px;">
                                <i class="fas fa-circle-exclamation" style="color:#a78bfa; font-size:20px; margin-top:2px; flex-shrink:0;"></i>
                                <div style="flex:1;">
                                    <p style="font-weight:600; color:#e5e7eb; margin:0 0 6px;">Seu perfil está incompleto — você não aparece nas buscas</p>
                                    <p style="font-size:13px; color:#9ca3af; margin:0 0 8px;">Para aparecer nas pesquisas, adicione:</p>
                                    <ul style="margin:0; padding-left:18px; color:#9ca3af; font-size:13px;">
                                        ${faltando.map(item => `<li>${item}</li>`).join('')}
                                    </ul>
                                </div>
                                <a href="editar.html" style="
                                    white-space: nowrap;
                                    padding: 10px 20px;
                                    background: var(--accent);
                                    border-radius: 8px;
                                    color: white;
                                    text-decoration: none;
                                    font-size: 14px;
                                    font-weight: 600;
                                    flex-shrink: 0;
                                ">Completar agora</a>
                            </div>
                        `;
                        container.prepend(banner);
                    }
                }
            }

            // Area
            const areas = Array.isArray(usuarioVisto.area_atuacao) ? usuarioVisto.area_atuacao : [];
            if (areas.length) document.getElementById('areaBadge').textContent = areas[0];

            // Tags
            const renderTags = (arr, containerId, icon) => {
                const cont = document.getElementById(containerId);
                cont.innerHTML = arr.length
                    ? arr.map(t => `<span class="skill-tag"><i class="${icon}"></i>${t}</span>`).join('')
                    : '<span style="color:#555; font-size:12px;">Nenhum item adicionado</span>';
            };
            renderTags(usuarioVisto.instrumentos || [], 'talentosCont', 'fas fa-music');
            renderTags(usuarioVisto.generos || [], 'generosCont', 'fas fa-compact-disc');

            if (usuarioVisto.daws?.length) {
                document.getElementById('dawsSection').classList.remove('hidden');
                renderTags(usuarioVisto.daws, 'dawsCont', 'fas fa-sliders');
            }

            // Social
            const sociais = usuarioVisto.redes_sociais || {};
            const linksHtml = Object.entries(sociais).filter(([,v])=>v).map(([k,v])=>{
                const icon = SOCIAL_ICONS[k] || 'fa-solid fa-link';
                return `<a href="${v}" target="_blank" class="skill-tag" style="text-decoration:none;"><i class="${icon}"></i>${k}</a>`;
            }).join('');
            document.getElementById('socialLinks').innerHTML = linksHtml || '<span style="color:#555; font-size:12px;">Sem redes sociais</span>';

            // Previews
            if (ehProprio) document.getElementById('addPreviaPanel').classList.remove('hidden');
            renderizarPostagensDoUsuario(usuarioVisto.id_usuario, document.getElementById('previasLista'));
            renderizarWorkOnsDoUsuario(usuarioVisto.id_usuario, document.getElementById('workOnsPerfil'));

            hideLoading();
        }

        document.querySelectorAll('[data-profile-tab]').forEach((button) => {
            button.addEventListener('click', () => {
                const workOns = button.dataset.profileTab === 'workons';
                document.getElementById('painelPostagens').hidden = workOns;
                document.getElementById('painelWorkOns').hidden = !workOns;
                document.querySelectorAll('[data-profile-tab]').forEach((tab) => {
                    const active = tab === button;
                    tab.classList.toggle('active', active);
                    tab.setAttribute('aria-selected', String(active));
                });

                document.querySelectorAll('[data-music-type]').forEach((button) => {
                    button.addEventListener('click', () => {
                        document.querySelectorAll('[data-music-type]').forEach((tab) => {
                            const active = tab === button;
                            tab.classList.toggle('active', active);
                            tab.setAttribute('aria-selected', String(active));
                        });
                        if (idUsuarioAtual) carregarMaisOuvidos(idUsuarioAtual);
                    });
                });
                document.getElementById('periodoMusica').addEventListener('change', () => {
                    if (idUsuarioAtual) carregarMaisOuvidos(idUsuarioAtual);
                });
            });
        });

        // ── Seletor de status ──────────────────────────────────────────────────
        document.getElementById('statusBadge')?.addEventListener('click', (e) => {
            if (!e.currentTarget.classList.contains('is-editable')) return;
            e.stopPropagation();
            document.getElementById('statusDropdown').classList.toggle('open');
        });
        document.addEventListener('click', () => {
            document.getElementById('statusDropdown')?.classList.remove('open');
        });
        document.querySelectorAll('.status-option').forEach(opt => {
            opt.addEventListener('click', async () => {
                const novoStatus = opt.dataset.status;
                document.getElementById('statusDropdown').classList.remove('open');
                aplicarStatus(novoStatus);
                const usuarioLogado = JSON.parse(localStorage.getItem('usuarioLogado') || '{}');
                try {
                    await fetch(`/api/usuarios/${usuarioLogado.id_usuario}/status`, {
                        method: 'PATCH',
                        headers: authHeaders(),
                        body: JSON.stringify({ status: novoStatus })
                    });
                    usuarioLogado.status = novoStatus;
                    localStorage.setItem('usuarioLogado', JSON.stringify(usuarioLogado));
                } catch (err) { console.error(err); }
            });
        });

        document.getElementById('btnEditarPerfil')?.addEventListener('click', () => {
            if (document.getElementById('btnEditarPerfil').classList.contains('hidden')) return;
            window.location.href = 'editar.html';
        });

        showLoading('Entrando no Backstage...');
        iniciarPerfil();
    </script>
    <div class="tab-bar-spacer"></div>
    <nav class="tab-bar" aria-label="Navegação principal"></nav>
</body>
