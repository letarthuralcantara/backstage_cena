<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Backstage | Work On</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="shortcut icon" href="../images/favicon.ico" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="../css/tokens.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/workon.css">
</head>
<body>
  <header class="header">
    <div class="header-left"><a href="feed.html"><img src="../images/logo.png" alt="Backstage Logo" class="logo-img"></a></div>
    <div class="header-center"></div>
    <div class="header-actions"><div class="profile-dropdown" id="profileDropdown"></div></div>
  </header>
  <main class="page">
    <div class="page-heading">
      <div><h1>Work On</h1><p>Organize projetos, faixas e pessoas em um só lugar.</p></div>
    </div>
    <div class="workon-tabs segmented" role="tablist" aria-label="Biblioteca de Work Ons">
      <button type="button" role="tab" aria-selected="true" class="active" data-workon-tab="meus">Meus</button>
      <button type="button" role="tab" aria-selected="false" data-workon-tab="compartilhados">Compartilhados comigo</button>
      <button type="button" role="tab" aria-selected="false" data-workon-tab="explorar">Explorar</button>
    </div>
    <div class="toolbar">
      <span>Seus projetos e colaborações</span>
      <div class="workon-views segmented" role="group" aria-label="Visualização">
        <button type="button" class="active" data-workon-view="galeria" aria-pressed="true">Galeria</button>
        <button type="button" data-workon-view="lista" aria-pressed="false">Lista</button>
        <button type="button" data-workon-view="quadro" aria-pressed="false">Quadro</button>
      </div>
    </div>
    <p id="workonErro" role="status"></p>
    <div id="workonGrid" class="workon-grid" aria-live="polite"></div>
    <section class="workon-create" id="criarWorkOn">
      <h2>Criar Work On</h2>
      <form id="criarWorkOn">
        <label>Título<input name="titulo" required minlength="3" maxlength="80"></label>
        <label>Tipo<select name="tipo"><option value="album">Álbum</option><option value="ep">EP</option><option value="single">Single</option><option value="beat_tape">Beat tape</option><option value="outro">Outro</option></select></label>
        <label>Visibilidade<select name="visibilidade"><option value="publico">Público</option><option value="link">Por link</option></select></label>
        <button type="submit">Criar projeto</button>
      </form>
    </section>
  </main>
  <div class="tab-bar-spacer"></div><nav class="tab-bar" aria-label="Navegação principal"></nav>
  <script type="module">
    import { initNavbar } from "../js/navbar.js";
    import { iniciarBibliotecaWorkOn } from "../js/workon.js";
    await initNavbar();
    await iniciarBibliotecaWorkOn();
  </script>
</body>
</html>
