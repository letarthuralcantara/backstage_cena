<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Login - Backstage Cena</title>
    <meta name="description" content="Entre na sua conta Backstage Cena e continue se conectando com músicos e artistas.">
    <meta name="robots" content="index, follow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="shortcut icon" href="../images/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/tokens.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="auth">
    <div class="container">
        <div class="login-card">
            <div class="logo-container">
                <a href="index.html"><img src="../images/logo.png" alt="Backstage Logo" class="logo-img"></a>
            </div>

            <h1 class="form-title">Entrar</h1>
            <p class="form-subtitle">Continue de onde parou</p>

            <div class="erro-msg" id="erroMsg"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seu@email.com" required maxlength="255">
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="••••••••" required minlength="6" maxlength="128">
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="lembrar" name="lembrar">
                    <label for="lembrar">Lembrar-me</label>
                </div>

                <button type="submit" class="btn-primary">Entrar</button>
            </form>

            <p class="esqueci-link"><a href="esqueci-senha.html">Esqueci minha senha</a></p>

            <div class="divider"><span>ou</span></div>

            <div class="signup-link">Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></div>

            <div class="back-home"><a href="index.html">Voltar para home</a></div>
        </div>
    </div>

    <script type="module">
        import { showLoading, hideLoading } from '../js/loading.js';
        import { fazerLogin, aplicarErroApiNoCampo } from '../js/auth.js';
        const form = document.getElementById('loginForm');
        const erroMsg = document.getElementById('erroMsg');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            erroMsg.style.display = 'none';
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;

            try {
                await fazerLogin(email, senha);
                window.location.href = 'perfil.html';
            } catch (erro) {
                aplicarErroApiNoCampo(erro);
                erroMsg.textContent = erro.message || 'Erro ao fazer login.';
                erroMsg.style.display = 'block';
            }
        });
        showLoading('Carregando...');
        hideLoading();
    </script>
</body>
</html>
