<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Login - Backstage Cena</title>
    <meta name="description" content="Entre na sua conta Backstage Cena e continue se conectando com músicos e artistas.">
    <meta name="robots" content="index, follow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="shortcut icon" href="../images/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/global.css">
    <style>
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
        .container { position: relative; z-index: 1; width: 100%; max-width: 400px; }

        .login-card { padding: 40px 30px; animation: cardIn .5s var(--ease) both; }
        @keyframes cardIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

        .logo-container { margin-bottom: 28px; }
        .login-card .logo-img { width: 100px; height: auto; }

        .form-title { font-size: 22px; margin-bottom: 5px; }
        .form-subtitle { color: var(--text-2); font-size: 14px; margin-bottom: 28px; }

        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; color: var(--text-2); font-size: 13px; font-weight: 500; margin-bottom: 7px; }
        input[type="email"], input[type="password"] {
            width: 100%; padding: 13px 16px;
            background: var(--glass-fill);
            border: 1px solid var(--glass-border);
            border-radius: var(--r-md);
            color: var(--text-1); font-size: 15px; font-family: 'Inter', sans-serif;
            transition: border-color .18s;
            outline: none;
        }
        input[type="email"]:focus, input[type="password"]:focus { border-color: var(--text-1); }

        .checkbox-group { display: flex; align-items: center; gap: 9px; margin-bottom: 22px; }
        input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--accent); cursor: pointer; }
        .checkbox-group label { color: var(--text-2); font-size: 13px; cursor: pointer; }

        .esqueci-link { text-align: center; margin-top: 14px; }
        .esqueci-link a { color: var(--text-2); font-size: 13px; text-decoration: none; }
        .esqueci-link a:hover { color: var(--text-1); }

        .divider { text-align: center; margin: 24px 0; position: relative; }
        .divider::before { content: ''; position: absolute; left: 0; top: 50%; width: 100%; height: 1px; background: var(--glass-border); }
        .divider span { background: var(--ink); padding: 0 12px; color: var(--text-3); font-size: 12px; position: relative; z-index: 1; }

        .signup-link { text-align: center; color: var(--text-2); font-size: 14px; }
        .signup-link a { color: var(--text-1); text-decoration: none; font-weight: 600; border-bottom: 1px solid var(--glass-border); }
        .signup-link a:hover { border-color: var(--text-1); }

        .back-home { text-align: center; margin-top: 18px; }
        .back-home a { color: var(--text-3); text-decoration: none; font-size: 13px; }
        .back-home a:hover { color: var(--text-2); }

        @media (min-width: 480px) { .login-card { padding: 48px 40px; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-card glass-strong">
            <div class="logo-container">
                <a href="index.html"><img src="../images/logo.png" alt="Backstage Logo" class="logo-img"></a>
            </div>

            <h1 class="form-title">Entrar</h1>
            <p class="form-subtitle">Continue de onde parou</p>

            <div class="erro-msg" id="erroMsg"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="seu@email.com" required maxlength="255">
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="••••••••" required minlength="6" maxlength="128">
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="lembrar" name="lembrar">
                    <label for="lembrar">Lembrar-me</label>
                </div>

                <button type="submit" class="btn-primary" style="width:100%;">Entrar</button>
            </form>

            <p class="esqueci-link"><a href="esqueci-senha.html">Esqueci minha senha</a></p>

            <div class="divider"><span>ou</span></div>

            <div class="signup-link">Não tem uma conta? <a href="cadastro.html">Cadastre-se</a></div>

            <div class="back-home"><a href="index.html">Voltar para home</a></div>
        </div>
    </div>

    <script type="module">
        import { showLoading, hideLoading } from '../js/loading.js';
        import { fazerLogin, aplicarErroApiNoCampo } from '../js/auth.js';
        const form = document.getElementById('loginForm');
        const erroMsg = document.getElementById('erroMsg');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            erroMsg.style.display = 'none';
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;

            try {
                await fazerLogin(email, senha);
                window.location.href = 'perfil.html';
            } catch (erro) {
                aplicarErroApiNoCampo(erro);
                erroMsg.textContent = erro.message || 'Erro ao fazer login.';
                erroMsg.style.display = 'block';
            }
        });
        showLoading('Carregando...');
        hideLoading();
    </script>
</body>
</html>
