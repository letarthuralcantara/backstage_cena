<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Explorar Músicos - Backstage Cena</title>
    <meta name="description" content="Explore o Backstage Cena e encontre músicos, produtores e bandas por instrumento, gênero musical e localização.">
    <meta name="robots" content="index, follow">
    <link rel="shortcut icon" href="../images/favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/tokens.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="../css/search.css">
</head>
<body>

    <header class="header">
        <div class="header-left">
            <a href="index.html">
                <img src="../images/logo.png" alt="Backstage Logo" class="logo-img">
            </a>
        </div>

        <div class="header-center">
            <div class="header-search" id="searchBar">
                <i class="fas fa-search header-search-icon"></i>
                <input type="text" class="header-search-input" id="searchInput" placeholder="Buscar músicos...">
                <button class="btn-filtrar" id="btnFiltrar" title="Filtros">
                    <i class="fas fa-sliders"></i>
                    <span class="filtrar-count" id="filtrarCount">0</span>
                </button>
                <button class="header-search-btn" id="btnBuscar">Buscar</button>
            </div>
        </div>

        <div class="header-actions">
            <div class="profile-dropdown" id="profileDropdown"></div>
        </div>
    </header>

    <div class="filters-panel" id="filtersPanel">
        <div class="filters-grid">
            <div class="filter-group">
                <label>Estado</label>
                <select id="filtroEstado"><option value="">Todos</option></select>
            </div>
            <div class="filter-group">
                <label>Instrumento</label>
                <select id="filtroInstrumento"><option value="">Todos</option></select>
            </div>
            <div class="filter-group">
                <label>Gênero</label>
                <select id="filtroGenero"><option value="">Todos</option></select>
            </div>
            <div class="filter-group">
                <label>Status</label>
                <select id="filtroStatus">
                    <option value="">Qualquer</option>
                    <option value="disponivel">Disponível</option>
                    <option value="ocupado">Ocupado</option>
                    <option value="nao_perturbe">Não perturbe</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Agenda</label>
                <select id="filtroDisponibilidade"><option value="">Qualquer</option></select>
            </div>
            <div class="filter-group">
                <label>Área</label>
                <select id="filtroArea"><option value="">Todos</option></select>
            </div>
        </div>
    </div>

    <div class="container is-wide">
        <div class="hero">
            <h1 class="hero-title">Explorar músicos</h1>
            <p class="hero-subtitle">Encontre parceiros para criar e colaborar</p>
            <span class="total-count" id="totalCount">Carregando...</span>
        </div>

        <div class="musicians-grid" id="musiciansGrid"></div>
        <div class="empty-state" id="emptyState">
            <h3>Nenhum músico encontrado</h3>
            <p>Tente ajustar os filtros ou fazer uma nova busca</p>
        </div>
    </div>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <img src="../images/logo.png" alt="Backstage Logo" class="footer-logo-img">
                <p class="footer-note">A cena musical independente começa aqui. &copy; 2025 Backstage Cena</p>
                <a href="privacidade.html" class="footer-note">Política de Privacidade</a>
            </div>
        </div>
    </footer>

    <script type="module">
        import { aplicarFotoNoElemento } from '../js/auth.js';
        import { initNavbar } from '../js/navbar.js';

        await initNavbar({ escopo: 'busca' });

        // Delegação: os cards de músico são recriados a cada filtro (innerHTML),
        // então o listener fica no container (que não muda) em vez de em cada
        // card — evita reanexar um listener novo a cada nova renderização.
        document.getElementById('musiciansGrid')?.addEventListener('click', (e) => {
            const card = e.target.closest('.musician-card');
            if (card?.dataset.userId) {
                window.location.href = `perfil.html?id=${card.dataset.userId}`;
            }
        });
        const btnFiltrar = document.getElementById('btnFiltrar');
        const filtersPanel = document.getElementById('filtersPanel');
        const filtrarCount = document.getElementById('filtrarCount');

        btnFiltrar.addEventListener('click', () => {
            filtersPanel.classList.toggle('open');
            btnFiltrar.classList.toggle('active');
        });

        const searchInput = document.getElementById('searchInput');
        const btnBuscar = document.getElementById('btnBuscar');

        const paramsIniciais = new URLSearchParams(window.location.search);
        if (paramsIniciais.get('focar') === 'true') searchInput.focus();
        if (paramsIniciais.get('q')) searchInput.value = paramsIniciais.get('q');

        // Reflete a busca/filtros atuais na URL sem recarregar a página —
        // como o "netflix.com/search?q=...": dá pra copiar o link e voltar
        // direto pra este resultado, e o botão "voltar" do navegador funciona.
        function atualizarUrl() {
            const p = new URLSearchParams();
            const valores = {
                q: searchInput.value.trim(),
                estado: document.getElementById('filtroEstado').value,
                instrumento: document.getElementById('filtroInstrumento').value,
                genero: document.getElementById('filtroGenero').value,
                status: document.getElementById('filtroStatus').value,
                agenda: document.getElementById('filtroDisponibilidade').value,
                area: document.getElementById('filtroArea').value,
            };
            Object.entries(valores).forEach(([chave, valor]) => { if (valor) p.set(chave, valor); });
            const query = p.toString();
            history.replaceState(null, '', query ? `?${query}` : window.location.pathname);
        }

        // Aplica os filtros que vieram na URL (link compartilhado, ou "voltar"
        // do navegador) assim que as opções dos <select> existirem.
        function aplicarFiltrosDaUrl() {
            const mapa = {
                estado: 'filtroEstado', instrumento: 'filtroInstrumento', genero: 'filtroGenero',
                status: 'filtroStatus', agenda: 'filtroDisponibilidade', area: 'filtroArea',
            };
            let algumFiltroAtivo = false;
            Object.entries(mapa).forEach(([param, id]) => {
                const valor = paramsIniciais.get(param);
                const select = document.getElementById(id);
                if (valor && [...select.options].some(o => o.value === valor)) {
                    select.value = valor;
                    algumFiltroAtivo = true;
                }
            });
            if (algumFiltroAtivo) { filtersPanel.classList.add('open'); btnFiltrar.classList.add('active'); }
        }

        let todosMusicos = [];

        async function carregarMusicos() {
            try {
                const res = await fetch('/api/usuarios');
                todosMusicos = await res.json();
                popularFiltros(todosMusicos);
                aplicarFiltrosDaUrl();
                filtrar();
            } catch (e) {
                console.error(e);
            }
        }

        const STATUS_LABELS = {
            disponivel:   'Disponível',
            ocupado:      'Ocupado',
            nao_perturbe: 'Não perturbe',
            invisivel:    'Invisível',
        };

        function popularFiltros(musicos) {
            const estados = [...new Set(musicos.map(m => m.estado).filter(Boolean))].sort();
            // A API já retorna arrays, não strings JSON
            const instrumentos = [...new Set(musicos.flatMap(m => {
                if (Array.isArray(m.instrumentos)) return m.instrumentos;
                try { return JSON.parse(m.instrumentos || '[]'); } catch { return []; }
            }))].sort();
            const generos = [...new Set(musicos.flatMap(m => {
                if (Array.isArray(m.generos)) return m.generos;
                try { return JSON.parse(m.generos || '[]'); } catch { return []; }
            }))].sort();
            const areas = [...new Set(musicos.flatMap(m => {
                if (Array.isArray(m.area_atuacao)) return m.area_atuacao;
                if (m.area_atuacao) return [m.area_atuacao];
                return [];
            }))].sort();

            const addOptions = (id, items) => {
                const sel = document.getElementById(id);
                items.forEach(item => {
                    const opt = document.createElement('option');
                    opt.value = opt.textContent = item;
                    sel.appendChild(opt);
                });
            };

            const disponibilidades = [...new Set(musicos.flatMap(m => {
                if (Array.isArray(m.disponibilidades)) return m.disponibilidades;
                return [];
            }))].sort();

            addOptions('filtroEstado', estados);
            addOptions('filtroInstrumento', instrumentos);
            addOptions('filtroGenero', generos);
            addOptions('filtroArea', areas);
            addOptions('filtroDisponibilidade', disponibilidades);
        }

        function renderizarMusicos(lista) {
            const grid = document.getElementById('musiciansGrid');
            const empty = document.getElementById('emptyState');
            const total = document.getElementById('totalCount');
            // A API já filtra cadastros incompletos e invisíveis
            const visiveis = lista;
            total.textContent = `${visiveis.length} músico${visiveis.length !== 1 ? 's' : ''} encontrado${visiveis.length !== 1 ? 's' : ''}`;

            if (visiveis.length === 0) {
                grid.innerHTML = '';
                empty.style.display = 'block';
                return;
            }
            empty.style.display = 'none';

            grid.innerHTML = visiveis.map((m, idx) => {
                const nome = m.nome_artistico || m.nome_completo;
                const iniciais = nome.substring(0, 2).toUpperCase();
                // A API retorna arrays diretamente
                const instrumentos = Array.isArray(m.instrumentos) ? m.instrumentos : [];
                const tags = instrumentos.slice(0, 3).map(i => `<span class="tag">${i}</span>`).join('');
                const local = [m.cidade, m.estado].filter(Boolean).join(', ') || 'Localização não informada';
                const areas = Array.isArray(m.area_atuacao) ? m.area_atuacao : (m.area_atuacao ? [m.area_atuacao] : []);
                const areaLabel = areas.length > 0 ? areas[0] : '';
                // Status
                const status = m.status || 'disponivel';
                const statusLabel = STATUS_LABELS[status] || 'Disponível';

                return `
                <div class="musician-card" data-user-id="${m.id_usuario}" style="animation-delay:${idx * 0.05}s">
                    <div class="musician-header">
                        <div class="musician-avatar">
                            <div class="musician-photo">${iniciais}</div>
                            <span class="status-dot musician-status ${status}" title="${statusLabel}"></span>
                        </div>
                        <div class="musician-info">
                            <div class="musician-name">${nome}</div>
                            <div class="musician-location">${local}</div>
                            ${areaLabel ? `<span class="musician-area">${areaLabel}</span>` : ''}
                        </div>
                    </div>
                    ${m.biografia ? `<p class="musician-bio">${m.biografia}</p>` : ''}
                    ${tags ? `<div class="musician-tags">${tags}</div>` : ''}
                </div>`;
            }).join('');

            grid.querySelectorAll('.musician-photo').forEach((avatar, index) => {
                const musico = visiveis[index];
                const nome = musico.nome_artistico || musico.nome_completo;
                aplicarFotoNoElemento(avatar, musico.imagem?.caminho, nome);
            });
        }

        function filtrar() {
            const q = searchInput.value.toLowerCase().trim();
            const estado = document.getElementById('filtroEstado').value;
            const instrumento = document.getElementById('filtroInstrumento').value;
            const genero = document.getElementById('filtroGenero').value;
            const status = document.getElementById('filtroStatus').value;
            const agenda = document.getElementById('filtroDisponibilidade').value;
            const area = document.getElementById('filtroArea').value;

            let ativos = 0;
            if (estado) ativos++;
            if (instrumento) ativos++;
            if (genero) ativos++;
            if (status) ativos++;
            if (agenda) ativos++;
            if (area) ativos++;

            filtrarCount.textContent = ativos;
            filtrarCount.classList.toggle('show', ativos > 0);

            const resultado = todosMusicos.filter(m => {
                const nome = (m.nome_artistico || m.nome_completo || '').toLowerCase();
                const bio = (m.biografia || '').toLowerCase();
                if (q && !nome.includes(q) && !bio.includes(q)) return false;
                if (estado && m.estado !== estado) return false;

                const areas = Array.isArray(m.area_atuacao) ? m.area_atuacao : (m.area_atuacao ? [m.area_atuacao] : []);
                if (area && !areas.includes(area)) return false;

                const insts = Array.isArray(m.instrumentos) ? m.instrumentos : [];
                if (instrumento && !insts.includes(instrumento)) return false;

                const gens = Array.isArray(m.generos) ? m.generos : [];
                if (genero && !gens.includes(genero)) return false;

                // Status Discord
                if (status && m.status !== status) return false;

                // Agenda/Disponibilidade por horário
                const disps = Array.isArray(m.disponibilidades) ? m.disponibilidades : [];
                if (agenda && !disps.includes(agenda)) return false;

                return true;
            });

            renderizarMusicos(resultado);
            atualizarUrl();
        }

        btnBuscar.addEventListener('click', filtrar);
        searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') filtrar(); });
        // Estilo Netflix: filtra em tempo real enquanto digita, sem precisar
        // apertar Enter ou clicar em Buscar.
        let debounceBusca;
        searchInput.addEventListener('input', () => {
            clearTimeout(debounceBusca);
            debounceBusca = setTimeout(filtrar, 200);
        });
        ['filtroEstado','filtroInstrumento','filtroGenero','filtroStatus','filtroDisponibilidade','filtroArea'].forEach(id => {
            document.getElementById(id).addEventListener('change', filtrar);
        });

        carregarMusicos();
    </script>

    <script>
        /* ── CANVAS PARTÍCULAS ── */
    </script>
    <div class="tab-bar-spacer"></div>
    <nav class="tab-bar" aria-label="Navegação principal"></nav>
</body>
</html>
