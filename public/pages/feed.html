<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed de Prévias - Backstage Cena</title>
    <link rel="shortcut icon" href="../images/favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/global.css">
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-glow: rgba(139, 92, 246, 0.6);
            --secondary: #d946ef;
            --bg-dark: #050505;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            min-height: 100vh;
            background-image:
                radial-gradient(circle at 10% 10%, rgba(139,92,246,0.15), transparent 50%),
                radial-gradient(circle at 90% 90%, rgba(217,70,239,0.1), transparent 50%);
            background-attachment: fixed;
        }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }
        .hero { text-align: center; padding: 60px 0 20px; }
        .hero-title { font-family:'Poppins',sans-serif; font-size: 42px; font-weight: 900; }
        .hero-title span { background: linear-gradient(135deg,var(--primary),var(--secondary)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .hero-subtitle { color:#aaa; margin-top: 10px; font-size: 16px; }

        .feed-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 40px 0 80px;
        }
        @media (max-width: 900px) { .feed-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 560px) { .feed-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-left">
            <a href="index.html"><img src="../images/logo.png" alt="Backstage Logo" class="logo-img"></a>
        </div>
        <div class="header-center">
            <div class="header-search">
                <i class="fas fa-search header-search-icon"></i>
                <input type="text" class="header-search-input" placeholder="Buscar músicos..." readonly onclick="location.href='pesquisar_usuarios.html?focar=true'">
                <button class="header-search-btn" onclick="location.href='pesquisar_usuarios.html?focar=true'">Buscar</button>
            </div>
        </div>
        <div class="header-actions">
            <div class="profile-dropdown" id="profileDropdown">
                <div class="profile-trigger" id="profileTrigger"></div>
                <div class="dropdown-menu">
                    <a href="perfil.html" class="dropdown-item"><i class="fas fa-user"></i> Meu Perfil</a>
                    <a href="pesquisar_usuarios.html" class="dropdown-item"><i class="fas fa-search"></i> Buscar Músicos</a>
                    <a href="config.html" class="dropdown-item"><i class="fas fa-cog"></i> Configurações</a>
                    <div class="dropdown-divider"></div>
                    <div class="dropdown-item" id="btnSair"><i class="fas fa-sign-out-alt"></i> Sair</div>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="hero">
            <h1 class="hero-title">Feed de <span>Prévias</span></h1>
            <p class="hero-subtitle">Trechos de músicas que somem em 24h</p>
        </div>

        <div class="feed-grid" id="feedGrid"></div>
    </div>

    <footer>
        <div class="footer-content">
            <img src="../images/logo.png" alt="Backstage Logo" class="footer-logo-img">
            <p>A cena musical independente começa aqui. &copy; 2025 Backstage Cena</p>
        </div>
    </footer>

    <script type="module">
        import { verificarAutenticacao, fazerLogout } from '../js/auth.js';
        import { renderizarGradeFeedPostagens } from '../js/postagens.js';

        const usuario = verificarAutenticacao();
        if (usuario) {
            const nome = usuario.nome_artistico || usuario.nome_completo;
            document.getElementById('profileTrigger').textContent = nome.substring(0, 2).toUpperCase();
        }
        document.getElementById('profileDropdown')?.addEventListener('click', () => {
            document.getElementById('profileDropdown').classList.toggle('active');
        });
        document.getElementById('btnSair')?.addEventListener('click', fazerLogout);

        renderizarGradeFeedPostagens(document.getElementById('feedGrid'));
    </script>
</body>
</html>
