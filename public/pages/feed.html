<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Backstage | Feed da Cena</title>
    <meta name="description" content="Veja as últimas postagens, faixas e novidades dos músicos que você segue no Backstage Cena.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="shortcut icon" href="../images/favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/clubes.css">
    <style>
        /* Só o que é específico do feed — o resto (header, glass, cores,
           raios) já vem do global.css. */
        .container {
            max-width: 680px;
            margin: 24px auto;
            padding: 0 16px;
            position: relative;
            z-index: 1;
        }

        .page-header { margin-bottom: 28px; }
        .hero-badge {
            display: inline-flex; align-items: center; gap: 8px;
            background: var(--glass-fill); border: 1px solid var(--glass-border);
            padding: 6px 14px; border-radius: var(--r-full);
            font-size: 12px; font-weight: 600; color: var(--primary);
            margin-bottom: 14px;
        }
        .hero-badge::before {
            content: ''; width: 7px; height: 7px; border-radius: 50%;
            background: #ef4444; box-shadow: 0 0 8px #ef4444;
        }
        .hero-title { font-size: clamp(28px, 6vw, 40px); line-height: 1.1; text-align: left; }
        .hero-title span { color: var(--accent); }
        .hero-subtitle { color: var(--text-2); margin-top: 8px; font-size: 15px; }

        .section-block { margin-bottom: 32px; }
        .section-heading {
            font-family: 'Poppins', sans-serif;
            font-size: 14px; font-weight: 700;
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 14px;
        }
        .section-heading i { color: var(--primary); font-size: 13px; }
        .section-heading .count-badge { margin-left: auto; font-size: 12px; font-weight: 600; color: var(--text-2); }

        .feed-timeline { display: flex; flex-direction: column; gap: 14px; }

        .feed-item {
            background: var(--glass-fill);
            -webkit-backdrop-filter: var(--glass-blur);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: var(--r-lg);
            padding: 18px;
            box-shadow: inset 0 1px 0 var(--glass-highlight);
            transition: border-color .25s, transform .25s var(--ease);
            animation: fadeInUp .4s var(--ease) both;
        }
        .feed-item:hover { border-color: rgba(139, 92, 246, .4); transform: translateY(-2px); }

        .item-header { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
        .author-avatar {
            width: 40px; height: 40px; border-radius: 50%;
            background: var(--glass-fill-strong); border: 1px solid var(--glass-border);
            display: flex; align-items: center; justify-content: center;
            font-weight: 600; font-size: 13px; color: var(--text-1); flex-shrink: 0;
        }
        .author-info { flex: 1; min-width: 0; }
        .author-name { font-family: 'Poppins', sans-serif; font-size: 14px; font-weight: 700; }
        .post-meta { font-size: 12px; color: var(--text-2); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .tweet-body { font-size: 15px; line-height: 1.6; color: var(--text-1); white-space: pre-wrap; word-break: break-word; }

        @keyframes fadeInUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>

    <header class="header">
        <div class="header-left">
            <a href="index.html"><img src="../images/logo.png" alt="Backstage Logo" class="logo-img"></a>
        </div>
        <div class="header-center">
            <div class="header-search" id="searchBar">
                <i class="fas fa-search header-search-icon"></i>
                <input type="text" class="header-search-input" placeholder="Buscar músicos..." readonly>
                <button class="header-search-btn">Buscar</button>
            </div>
        </div>
        <div class="header-actions">
            <div class="profile-dropdown" id="profileDropdown"></div>
        </div>
    </header>

    <div class="container">
        <div class="page-header">
            <div class="hero-badge">Ao vivo agora</div>
            <h1 class="hero-title">Feed da <span>Cena</span></h1>
            <p class="hero-subtitle">Prévias e tweets da comunidade</p>
        </div>

        <div class="section-block">
            <h2 class="section-heading">Prévias</h2>
            <div class="stories-bar" id="storiesBar"></div>
        </div>

        <div class="section-block" id="blocoClubes" hidden>
            <h2 class="section-heading"><i class="fas fa-people-group"></i> Clubes para você <a class="section-link" href="clubes.html">Ver todos</a></h2>
            <div class="clubes-grid" id="feedClubes"></div>
        </div>

        <div class="section-block">
            <h2 class="section-heading">Geral</h2>
            <div class="feed-timeline" id="feedTimeline"></div>
        </div>
    </div>

    <div class="tab-bar-spacer"></div>
    <nav class="tab-bar" aria-label="Navegação principal"></nav>

    <script type="module">
        import { renderizarFeedPostagens, buscarTweetsFeed, tempoRelativo, tempoRestante, adicionarImagemTweet, renderizarAvatarAutor } from '../js/postagens.js';
        import { ClubesAPI, criarCardClube, prepararCabecalho } from '../js/clubes.js';

        document.addEventListener('DOMContentLoaded', async () => {
            await prepararCabecalho();

            function iniciais(nome) {
                const partes = nome.trim().split(/\s+/).filter(Boolean);
                if (partes.length >= 2) return (partes[0][0] + partes[1][0]).toUpperCase();
                return nome.substring(0, 2).toUpperCase();
            }

            function escaparHtml(texto) {
                const div = document.createElement('div');
                div.textContent = texto;
                return div.innerHTML;
            }

            function criarCardTweet(t) {
                const item = document.createElement('div');
                item.className = 'feed-item';
                const expira = tempoRestante(t.expira_em);
                item.innerHTML = `
                    <div class="item-header">
                        <div class="author-avatar">${escaparHtml(iniciais(t.autor.nome))}</div>
                        <div class="author-info">
                            <div class="author-name">${escaparHtml(t.autor.nome)}</div>
                            <div class="post-meta">
                                <span>há ${tempoRelativo(t.criado_em)}</span>
                                ${expira ? `<span>•</span><span style="color:#ef4444;"><i class="fas fa-clock"></i> some em ${expira}</span>` : ''}
                            </div>
                        </div>
                    </div>
                    <div class="tweet-body">${escaparHtml(t.texto)}</div>
                `;
                renderizarAvatarAutor(item.querySelector('.author-avatar'), t.autor);
                adicionarImagemTweet(item, t);
                return item;
            }

            async function iniciarFeedGeral() {
                const timeline = document.getElementById('feedTimeline');
                if (!timeline) return;

                timeline.innerHTML = '<p class="feed-loading">Carregando...</p>';
                try {
                    const tweets = await buscarTweetsFeed();
                    timeline.innerHTML = '';

                    if (!tweets || tweets.length === 0) {
                        timeline.innerHTML = '<p class="feed-vazio">Nada por aqui ainda. Seja o primeiro a tweetar!</p>';
                        return;
                    }

                    tweets.forEach((t, index) => {
                        const card = criarCardTweet(t);
                        card.style.animationDelay = `${Math.min(index, 10) * 0.05}s`;
                        timeline.appendChild(card);
                    });
                } catch (err) {
                    timeline.innerHTML = '<p class="feed-vazio">Erro ao carregar o feed.</p>';
                }
            }

            // Clubes recomendados pela afinidade (gêneros, instrumentos e DAWs do perfil).
            async function iniciarClubesRecomendados() {
                const bloco = document.getElementById('blocoClubes');
                const grid = document.getElementById('feedClubes');
                if (!bloco || !grid) return;
                try {
                    const clubes = await ClubesAPI.recomendados(4);
                    if (!clubes.length) return;
                    clubes.forEach((c) => grid.appendChild(criarCardClube(c, {
                        compacto: true,
                        aoEntrar: async (clube, botao) => {
                            botao.disabled = true;
                            try {
                                await ClubesAPI.entrar(clube.id_clube);
                                window.location.href = `clube.html?id=${clube.id_clube}`;
                            } catch (e) { botao.disabled = false; alert(e.message); }
                        },
                    })));
                    bloco.hidden = false;
                } catch (err) {
                    console.error('Clubes recomendados:', err);
                }
            }

            // Inicializa componentes
            const storiesBar = document.getElementById('storiesBar');
            if (storiesBar) renderizarFeedPostagens(storiesBar);
            iniciarFeedGeral();
            iniciarClubesRecomendados();

        });
    </script>

    <script>
        // Partículas de fundo — desligadas se o sistema pedir menos movimento.
        const canvas = document.getElementById('bg-canvas');
        if (canvas && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            const ctx = canvas.getContext('2d');
            let particles = [];
            function initCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
            class Particle {
                constructor() {
                    this.x = Math.random()*canvas.width; this.y = Math.random()*canvas.height;
                    this.size = Math.random()*2; this.speedX = Math.random()*0.5-0.25;
                    this.speedY = Math.random()*0.5-0.25; this.opacity = Math.random()*0.5+0.1;
                }
                update() {
                    this.x+=this.speedX; this.y+=this.speedY;
                    if(this.x>canvas.width)this.x=0; if(this.x<0)this.x=canvas.width;
                    if(this.y>canvas.height)this.y=0; if(this.y<0)this.y=canvas.height;
                }
                draw() {
                    ctx.fillStyle=`rgba(139,92,246,${this.opacity})`;
                    ctx.beginPath(); ctx.arc(this.x,this.y,this.size,0,Math.PI*2); ctx.fill();
                }
            }
            function createParticles() { for(let i=0;i<100;i++) particles.push(new Particle()); }
            function animate() {
                ctx.clearRect(0,0,canvas.width,canvas.height);
                particles.forEach(p=>{p.update();p.draw()});
                requestAnimationFrame(animate);
            }
            window.addEventListener('resize', initCanvas);
            initCanvas(); createParticles(); animate();
        }
    </script>
</body>
</html>
