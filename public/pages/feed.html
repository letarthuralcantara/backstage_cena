<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Backstage | Feed da Cena</title>
    <meta name="description" content="Veja as últimas postagens, faixas e novidades dos músicos que você segue no Backstage Cena.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="shortcut icon" href="../images/favicon.ico" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="../css/tokens.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/app.css">
    <link rel="stylesheet" href="../css/clubes.css">
</head>
<body>

    <header class="header">
        <div class="header-left">
            <a href="index.html"><img src="../images/logo.png" alt="Backstage Logo" class="logo-img"></a>
        </div>
        <div class="header-center">
            <div class="header-search" id="searchBar">
                <i class="fas fa-search header-search-icon"></i>
                <input type="text" class="header-search-input" placeholder="Buscar músicos..." readonly>
                <button class="header-search-btn">Buscar</button>
            </div>
        </div>
        <div class="header-actions">
            <div class="profile-dropdown" id="profileDropdown"></div>
        </div>
    </header>

    <div class="container">
        <div class="page-header">
            <h1 class="hero-title">Feed da cena</h1>
            <p class="hero-subtitle">Prévias e tweets da comunidade</p>
        </div>

        <nav class="feed-filters segmented filterbar" aria-label="Filtrar feed">
            <button type="button" class="active" data-feed-filter="todos" aria-pressed="true">Tudo</button>
            <button type="button" data-feed-filter="workons" aria-pressed="false">Work Ons</button>
        </nav>

        <div class="section-block" id="blocoPrevias">
            <h2 class="section-heading">Prévias</h2>
            <div class="stories-bar" id="storiesBar"></div>
        </div>

        <div class="section-block" id="blocoClubes" hidden>
            <h2 class="section-heading">Clubes para você <a class="section-link" href="clubes.html">Ver todos</a></h2>
            <div class="clubes-grid" id="feedClubes"></div>
        </div>

        <div class="section-block">
            <h2 class="section-heading">Geral</h2>
            <div class="feed-timeline" id="feedTimeline"></div>
        </div>
        <div class="section-block" id="blocoWorkOns" hidden>
            <h2 class="section-heading">Work Ons públicos</h2>
            <div class="workon-feed-grid" id="feedWorkOns" aria-live="polite"></div>
        </div>
    </div>

    <div class="tab-bar-spacer"></div>
    <nav class="tab-bar" aria-label="Navegação principal"></nav>

    <script type="module">
        import { renderizarFeedPostagens, buscarTweetsFeed, tempoRelativo, tempoRestante, adicionarImagemTweet, renderizarAvatarAutor } from '../js/postagens.js';
        import { ClubesAPI, criarCardClube, prepararCabecalho } from '../js/clubes.js';
        import { authHeaders } from '../js/auth.js';

        document.addEventListener('DOMContentLoaded', async () => {
            await prepararCabecalho();

            function iniciais(nome) {
                const partes = nome.trim().split(/\s+/).filter(Boolean);
                if (partes.length >= 2) return (partes[0][0] + partes[1][0]).toUpperCase();
                return nome.substring(0, 2).toUpperCase();
            }

            function escaparHtml(texto) {
                const div = document.createElement('div');
                div.textContent = texto;
                return div.innerHTML;
            }

            function criarCardTweet(t) {
                const item = document.createElement('div');
                item.className = 'feed-item';
                const expira = tempoRestante(t.expira_em);
                item.innerHTML = `
                    <div class="item-header">
                        <div class="author-avatar">${escaparHtml(iniciais(t.autor.nome))}</div>
                        <div class="author-info">
                            <div class="author-name">${escaparHtml(t.autor.nome)}</div>
                            <div class="post-meta">
                                <span>há ${tempoRelativo(t.criado_em)}</span>
                                ${expira ? `<span>•</span><span class="post-expira"><i class="fas fa-clock"></i> some em ${expira}</span>` : ''}
                            </div>
                        </div>
                    </div>
                    <div class="tweet-body">${escaparHtml(t.texto)}</div>
                `;
                renderizarAvatarAutor(item.querySelector('.author-avatar'), t.autor);
                adicionarImagemTweet(item, t);
                return item;
            }

            async function iniciarFeedGeral() {
                const timeline = document.getElementById('feedTimeline');
                if (!timeline) return;

                timeline.innerHTML = '<p class="feed-loading">Carregando...</p>';
                try {
                    const tweets = await buscarTweetsFeed();
                    timeline.innerHTML = '';

                    if (!tweets || tweets.length === 0) {
                        timeline.innerHTML = '<p class="feed-vazio">Nada por aqui ainda. Seja o primeiro a tweetar!</p>';
                        return;
                    }

                    tweets.forEach((t, index) => {
                        const card = criarCardTweet(t);
                        card.style.animationDelay = `${Math.min(index, 10) * 0.05}s`;
                        timeline.appendChild(card);
                    });
                } catch (err) {
                    timeline.innerHTML = '<p class="feed-vazio">Erro ao carregar o feed.</p>';
                }
            }

            // Clubes recomendados pela afinidade (gêneros, instrumentos e DAWs do perfil).
            async function iniciarClubesRecomendados() {
                const bloco = document.getElementById('blocoClubes');
                const grid = document.getElementById('feedClubes');
                if (!bloco || !grid) return;
                try {
                    const clubes = await ClubesAPI.recomendados(4);
                    if (!clubes.length) return;
                    clubes.forEach((c) => grid.appendChild(criarCardClube(c, {
                        compacto: true,
                        aoEntrar: async (clube, botao) => {
                            botao.disabled = true;
                            try {
                                await ClubesAPI.entrar(clube.id_clube);
                                window.location.href = `clube.html?id=${clube.id_clube}`;
                            } catch (e) { botao.disabled = false; alert(e.message); }
                        },
                    })));
                    bloco.hidden = false;
                } catch (err) {
                    console.error('Clubes recomendados:', err);
                }
            }

            let workOnsCarregados = false;
            async function carregarWorkOns() {
                const grid = document.getElementById('feedWorkOns');
                grid.innerHTML = '<p class="feed-loading">Carregando Work Ons...</p>';
                try {
                    const res = await fetch('/api/workons?limite=30', { headers: authHeaders({}, false) });
                    if (!res.ok) throw new Error('Falha ao carregar Work Ons.');
                    const workOns = await res.json();
                    grid.innerHTML = '';
                    if (!workOns.length) {
                        grid.innerHTML = '<p class="feed-vazio">Nenhum Work On público encontrado.</p>';
                        return;
                    }
                    workOns.forEach((workOn) => {
                        const card = document.createElement('a');
                        card.className = 'workon-feed-card';
                        card.href = `workon.html?id=${encodeURIComponent(workOn.id_workon)}`;
                        const imagem = workOn.capa
                            ? `<img src="${escaparHtml(workOn.capa)}" alt="" loading="lazy">`
                            : '<span class="workon-feed-placeholder"><i class="fas fa-music"></i></span>';
                        card.innerHTML = `${imagem}<div><strong>${escaparHtml(workOn.titulo)}</strong><small>${escaparHtml(workOn.tipo)} · ${escaparHtml(workOn.status)}</small><small>por ${escaparHtml(workOn.dono.nome)}</small></div>`;
                        grid.appendChild(card);
                    });
                    workOnsCarregados = true;
                } catch (error) {
                    grid.textContent = error.message;
                }
            }

            document.querySelectorAll('[data-feed-filter]').forEach((button) => {
                button.addEventListener('click', async () => {
                    const workOns = button.dataset.feedFilter === 'workons';
                    document.querySelectorAll('[data-feed-filter]').forEach((item) => {
                        const active = item === button;
                        item.classList.toggle('active', active);
                        item.setAttribute('aria-pressed', String(active));
                    });
                    document.getElementById('blocoPrevias').hidden = workOns;
                    document.getElementById('blocoClubes').hidden = workOns || !document.getElementById('feedClubes').children.length;
                    document.getElementById('feedTimeline').parentElement.hidden = workOns;
                    document.getElementById('blocoWorkOns').hidden = !workOns;
                    if (workOns && !workOnsCarregados) await carregarWorkOns();
                });
            });

            // Inicializa componentes
            const storiesBar = document.getElementById('storiesBar');
            if (storiesBar) renderizarFeedPostagens(storiesBar);
            iniciarFeedGeral();
            iniciarClubesRecomendados();

        });
    </script>

    
</body>
</html>
